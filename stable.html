<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Librarium Stable</title><style>body{margin:0;background:#0d0f0e;color:#f4efe3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}header{position:sticky;top:0;background:#0d0f0eee;border-bottom:1px solid #2c302d;padding:14px 16px;display:flex;justify-content:space-between;z-index:4}.brand{font:22px Georgia,serif}.wrap{max-width:1000px;margin:auto;padding:28px 16px}.hero h1{font:clamp(40px,8vw,72px)/.98 Georgia,serif;margin:10px 0}.hero p,.mut{color:#9da198}.search{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;background:#151816;border:1px solid #2c302d;padding:10px;border-radius:12px;margin:24px 0}.search input{min-width:0;background:#0e110f;color:#fff;border:1px solid #303530;border-radius:8px;padding:12px}.search button,.smallbtn{background:#e8dcc0;color:#111;border:0;border-radius:8px;padding:11px 15px;font-weight:700}.status{padding-bottom:12px;border-bottom:1px solid #2c302d;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 14px}.book{cursor:pointer}.cover{position:relative;aspect-ratio:2/3;background:#1a1d1b;border-radius:8px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.book h2{font:17px/1.16 Georgia,serif;margin:9px 0 4px}.book p{font-size:12px;color:#9da198;margin:0}.meta{font-size:11px;color:#9da198;margin-top:7px}.overlay{position:fixed;inset:0;background:#000d;z-index:10;overflow:auto;padding:18px}.modal{max-width:800px;margin:auto;background:#151816;border:1px solid #2c302d;border-radius:14px;padding:24px;position:relative}.close{position:absolute;right:12px;top:12px;border:0;background:#262a27;color:#fff;border-radius:50%;width:40px;height:40px;font-size:22px}.detail{display:grid;grid-template-columns:170px 1fr;gap:24px}.detail img{width:170px;border-radius:8px}.detail h1{font:38px/1 Georgia,serif;margin:8px 0}.desc{font:15px/1.6 Georgia,serif;color:#c1c5be}.lib{margin-top:25px}.saved{padding:10px 0;border-bottom:1px solid #2c302d}.saved b{font-family:Georgia,serif}.saved button{float:right;background:none;border:0;color:#aaa}@media(max-width:700px){.search{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:95px 1fr}.detail img{width:95px}.detail h1{font-size:27px}.overlay{padding:0}.modal{min-height:100vh;border-radius:0}}</style></head><body><header><span class="brand">Librarium</span><button class="smallbtn" id="libraryBtn">Biblioteca</button></header><main class="wrap"><section class="hero"><small style="color:#d6b46b">VERSÃO ESTÁVEL</small><h1>Encontra o próximo livro.</h1><p>Pesquisa por título, tema ou autor. Nesta versão aparecem apenas registos com capa e autoria identificada.</p></section><form class="search" id="searchForm"><input id="query" placeholder="Título, tema ou palavra" autocomplete="off"><input id="author" placeholder="Autor" autocomplete="off"><button type="submit">Pesquisar</button></form><div class="status" id="status">Escreve uma pesquisa.</div><section class="grid" id="results"></section><section class="lib" id="library" hidden><h2>Biblioteca</h2><div id="savedList"></div></section></main><div id="modalHost"></div><script>(function(){const $=id=>document.getElementById(id);let books=[];let saved=[];try{saved=JSON.parse(localStorage.getItem('librariumStable')||'[]')}catch(e){}function esc(x){return String(x==null?'':x).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function cover(v){return(v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)||'').replace('http:','https:')}function good(x){const v=x.volumeInfo||{};return !!(v.title&&v.authors&&v.authors.length&&cover(v))}function year(v){return(v.publishedDate||'').slice(0,4)||'—'}function isbn(v){const a=v.industryIdentifiers||[];const i=a.find(x=>x.type==='ISBN_13')||a[0];return i?i.identifier:'—'}function render(){const host=$('results');host.innerHTML=books.map((x,i)=>{const v=x.volumeInfo||{};return'<article class="book" data-i="'+i+'"><div class="cover"><img loading="lazy" src="'+esc(cover(v))+'"></div><h2>'+esc(v.title)+'</h2><p>'+esc(v.authors.join(', '))+'</p><div class="meta">'+esc(year(v))+(v.publisher?' · '+esc(v.publisher):'')+'</div></article>'}).join('');host.querySelectorAll('.book').forEach(el=>el.addEventListener('click',()=>openBook(Number(el.dataset.i))))}function persist(){localStorage.setItem('librariumStable',JSON.stringify(saved));renderSaved()}function renderSaved(){$('savedList').innerHTML=saved.length?saved.map((b,i)=>'<div class="saved"><b>'+esc(b.title)+'</b><button data-r="'+i+'">Retirar</button><div class="mut">'+esc(b.author)+'</div></div>').join(''):'<p class="mut">Ainda não guardaste livros.</p>';$('savedList').querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{saved.splice(Number(b.dataset.r),1);persist()}))}function saveBook(v){if(!saved.some(x=>x.title===v.title&&x.author===(v.authors||[]).join(', ')))saved.unshift({title:v.title,author:(v.authors||[]).join(', '),cover:cover(v)});persist()}function openBook(i){const v=(books[i]||{}).volumeInfo||{};$('modalHost').innerHTML='<div class="overlay" id="ov"><section class="modal"><button class="close" id="close">×</button><div class="detail"><img src="'+esc(cover(v))+'"><div><small>'+(v.categories?esc(v.categories.slice(0,2).join(' · ')):'LIVRO')+'</small><h1>'+esc(v.title)+'</h1><p class="mut">'+esc((v.authors||[]).join(', '))+'</p><p>'+esc(year(v))+' · '+esc(v.publisher||'Editora não indicada')+' · ISBN '+esc(isbn(v))+'</p><button class="smallbtn" id="save">Guardar na biblioteca</button></div></div><h3>Sinopse</h3><div class="desc">'+(v.description||'Sem sinopse disponível nesta ficha.')+'</div></section></div>';$('close').onclick=()=>$('modalHost').innerHTML='';$('ov').onclick=e=>{if(e.target.id==='ov')$('modalHost').innerHTML=''};$('save').onclick=()=>saveBook(v)}async function doSearch(){const q=$('query').value.trim();const a=$('author').value.trim();if(!q&&!a){$('status').textContent='Escreve uma pesquisa.';return}const parts=[];if(q)parts.push(q);if(a)parts.push('inauthor:'+a);$('status').textContent='A procurar…';$('results').innerHTML='';try{const url='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(parts.join(' '))+'&maxResults=40&printType=books';const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();books=(j.items||[]).filter(good).slice(0,30);$('status').textContent=books.length?books.length+' livros com capa e autoria identificada.':'A fonte não devolveu resultados completos para esta pesquisa.';render()}catch(err){books=[];$('status').textContent='Não foi possível consultar o catálogo agora. Tenta novamente.';render()}}$('searchForm').addEventListener('submit',e=>{e.preventDefault();doSearch()});$('libraryBtn').addEventListener('click',()=>{const l=$('library');l.hidden=!l.hidden;if(!l.hidden){renderSaved();l.scrollIntoView({behavior:'smooth'})}});renderSaved()})();</script></body></html>
