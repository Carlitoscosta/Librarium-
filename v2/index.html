<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f0e">
<title>Librarium v2</title>
<style>
:root{--bg:#0d0f0e;--panel:#151816;--panel2:#111411;--ink:#f5f0e4;--mut:#9da198;--gold:#d6b46b;--line:#2d322e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:#0d0f0ef2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topin{max-width:1150px;margin:auto;padding:14px 16px;display:flex;align-items:center;gap:10px}.brand{font:24px Georgia,serif;margin-right:auto}.nav{background:transparent;border:0;color:var(--mut);padding:8px}.nav.active{color:var(--ink)}.wrap{max-width:1150px;margin:auto;padding:42px 16px 80px}.hero{display:grid;grid-template-columns:1.5fr .5fr;gap:26px;align-items:end;padding:25px 0 30px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold)}h1{font:clamp(44px,7vw,78px)/.95 Georgia,serif;margin:12px 0 15px}.hero p{color:var(--mut);max-width:730px;line-height:1.6}.dash{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:22px}.dash b{display:block;font:42px Georgia,serif}.dash span{color:var(--mut)}.search{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px}.row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px}.field{background:#0e110f;color:#fff;border:1px solid #303530;border-radius:8px;padding:12px;min-width:0}.primary{background:#e8dcc0;color:#111;border:0;border-radius:8px;padding:0 18px;font-weight:800}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.status{color:var(--mut);padding:18px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:26px 15px}.book{cursor:pointer;min-width:0}.cover{aspect-ratio:2/3;background:#1a1d1b;border-radius:9px;overflow:hidden;box-shadow:0 14px 30px #0005}.cover img{width:100%;height:100%;object-fit:cover}.fallback{height:100%;display:grid;place-items:center;padding:14px;text-align:center;font:18px Georgia,serif;color:#8d846d}.book h3{font:17px/1.15 Georgia,serif;margin:9px 0 4px}.book p{font-size:12px;color:var(--mut);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:7px}.empty{padding:55px 0;color:var(--mut);text-align:center}.overlay{position:fixed;inset:0;background:#000d;z-index:30;overflow:auto;padding:20px}.modal{max-width:900px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;position:relative}.close{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;background:#171b18;color:white;border:1px solid #39403a;font-size:24px}.mh{display:grid;grid-template-columns:180px 1fr;gap:26px;padding:45px;background:#171a16}.mh img,.mh .fallback{width:180px;height:270px;border-radius:8px;object-fit:cover;background:#20241f}.mh h2{font:40px/1 Georgia,serif;margin:6px 0}.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.facts span{font-size:11px;border:1px solid #343a35;border-radius:99px;padding:7px 9px}.body{padding:34px 45px}.body h3{font:23px Georgia,serif;border-bottom:1px solid var(--line);padding-bottom:8px}.desc{font:16px/1.7 Georgia,serif;color:#c5c9c1;white-space:pre-line}.links a{display:block;color:#e8dcc0;padding:7px 0;text-decoration:none}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 25px}.chip{border:1px solid var(--line);background:#151816;color:#ddd;border-radius:99px;padding:8px 12px}.libitem{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px;margin:8px 0}.libitem b{font:18px Georgia,serif}.libitem small{display:block;color:var(--mut);margin-top:3px}@media(max-width:850px){.grid{grid-template-columns:repeat(4,1fr)}.hero{grid-template-columns:1fr}.dash{display:none}}@media(max-width:650px){.nav{font-size:13px;padding:6px}.wrap{padding-top:24px}.row{grid-template-columns:1fr auto}.row input:nth-child(2){grid-column:1/-1;grid-row:2}.filters{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:23px 12px}.overlay{padding:0}.modal{min-height:100vh;border-radius:0}.mh{grid-template-columns:105px 1fr;padding:58px 16px 24px;gap:14px}.mh img,.mh .fallback{width:105px;height:158px}.mh h2{font-size:28px}.body{padding:24px 17px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var books=[], library=[]; try{library=JSON.parse(localStorage.getItem('librarium_rescue')||'[]')}catch(e){}
var view='discover';
function E(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function cover(v){var x=v.imageLinks||{};return String(x.thumbnail||x.smallThumbnail||'').replace('http:','https:')}
function render(){var html='<header class="top"><div class="topin"><div class="brand">Librarium</div><button class="nav '+(view==='discover'?'active':'')+'" id="nd">Descobrir</button><button class="nav '+(view==='library'?'active':'')+'" id="nl">Biblioteca ('+library.length+')</button></div></header><main class="wrap">';
if(view==='discover')html+='<section class="hero"><div><div class="eyebrow">CATÁLOGO DE LIVROS</div><h1>Descobre, compara e guarda livros.</h1><p>Pesquisa por título, autor ou tema. Esta versão foi simplificada para garantir compatibilidade total com Safari e GitHub Pages.</p></div><aside class="dash"><b>'+library.length+'</b><span>livros guardados</span></aside></section><section class="search"><div class="row"><input class="field" id="q" placeholder="Título, autor ou tema"><input class="field" id="author" placeholder="Autor (opcional)"><button class="primary" id="go">Pesquisar</button></div><div class="filters"><select class="field" id="lang"><option value="">Todas as línguas</option><option value="pt">Português</option><option value="en">Inglês</option></select><select class="field" id="order"><option value="relevance">Relevância</option><option value="newest">Mais recentes</option></select><select class="field" id="quality"><option value="all">Todos</option><option value="cover">Com capa</option><option value="desc">Com descrição</option></select></div></section><div class="chips">'+['História','Filosofia','Ciência','Música','Arqueologia','Mitologia','Psicologia','Biografia'].map(function(x){return '<button class="chip" data-topic="'+x+'">'+x+'</button>'}).join('')+'</div><div class="status" id="status">Pronto para pesquisar.</div><section class="grid" id="grid">'+cards()+'</section>';
else html+='<div class="eyebrow">BIBLIOTECA</div><h1>A minha biblioteca</h1><p style="color:#9da198">Guardada apenas neste aparelho.</p>'+(library.length?library.map(function(x,i){return '<div class="libitem"><button style="float:right" data-rm="'+i+'">Retirar</button><b>'+E(x.title)+'</b><small>'+E(x.author)+'</small></div>'}).join(''):'<div class="empty">Ainda não guardaste livros.</div>');
html+='</main><div id="modal"></div>';document.getElementById('app').innerHTML=html;bind()}
function cards(){if(!books.length)return '<div class="empty" style="grid-column:1/-1">Faz uma pesquisa para começar.</div>';return books.map(function(b,i){var v=b.volumeInfo||{},c=cover(v);return '<article class="book" data-open="'+i+'"><div class="cover">'+(c?'<img src="'+E(c)+'">':'<div class="fallback">'+E(v.title||'Livro')+'</div>')+'</div><h3>'+E(v.title||'Sem título')+'</h3><p>'+E((v.authors||['Autor desconhecido']).join(', '))+'</p><div class="meta"><span>'+E((v.publishedDate||'—').slice(0,4))+'</span><span>'+(v.averageRating?'★ '+v.averageRating:(v.language||'').toUpperCase())+'</span></div></article>'}).join('')}
function bind(){var nd=document.getElementById('nd'),nl=document.getElementById('nl');if(nd)nd.onclick=function(){view='discover';render()};if(nl)nl.onclick=function(){view='library';render()};var go=document.getElementById('go');if(go)go.onclick=search;var q=document.getElementById('q');if(q)q.onkeydown=function(e){if(e.key==='Enter')search()};Array.prototype.forEach.call(document.querySelectorAll('[data-topic]'),function(b){b.onclick=function(){document.getElementById('q').value=b.getAttribute('data-topic');search()}});Array.prototype.forEach.call(document.querySelectorAll('[data-open]'),function(b){b.onclick=function(){openBook(+b.getAttribute('data-open'))}});Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'),function(b){b.onclick=function(){library.splice(+b.getAttribute('data-rm'),1);localStorage.setItem('librarium_rescue',JSON.stringify(library));render()}})}
async function search(){var q=document.getElementById('q').value.trim(),a=document.getElementById('author').value.trim(),lang=document.getElementById('lang').value,order=document.getElementById('order').value,quality=document.getElementById('quality').value;if(!q&&!a)return;document.getElementById('status').textContent='A procurar livros…';document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">A pesquisar…</div>';try{var query=[q,a?'inauthor:'+a:''].filter(Boolean).join(' ');var url='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(query)+'&maxResults=40&printType=books'+(lang?'&langRestrict='+lang:'')+(order==='newest'?'&orderBy=newest':'');var r=await fetch(url);var j=await r.json();books=j.items||[];if(quality==='cover')books=books.filter(function(b){return !!cover(b.volumeInfo||{})});if(quality==='desc')books=books.filter(function(b){return !!(b.volumeInfo||{}).description});document.getElementById('status').textContent=books.length+' resultados.';document.getElementById('grid').innerHTML=cards();bind()}catch(e){document.getElementById('status').textContent='Não foi possível concluir a pesquisa.';document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Erro de ligação à fonte de livros.</div>'}}
function openBook(i){var b=books[i],v=b.volumeInfo||{},c=cover(v),m=document.getElementById('modal');m.innerHTML='<div class="overlay" id="ov"><section class="modal"><button class="close" id="cl">×</button><div class="mh">'+(c?'<img src="'+E(c)+'">':'<div class="fallback">'+E(v.title||'Livro')+'</div>')+'<div><div class="eyebrow">'+E((v.categories||['LIVRO']).join(' · '))+'</div><h2>'+E(v.title||'Sem título')+'</h2><p style="color:#9da198">'+E((v.authors||['Autor desconhecido']).join(', '))+'</p><div class="facts"><span>'+E(v.publishedDate||'Data desconhecida')+'</span><span>'+E(v.pageCount||'—')+' págs.</span><span>'+E((v.language||'—').toUpperCase())+'</span><span>'+(v.averageRating?'★ '+v.averageRating:'Sem nota')+'</span></div><br><button class="primary" id="save" style="padding:10px 14px">Guardar</button></div></div><div class="body"><h3>Resumo / descrição</h3><div class="desc">'+E(v.description||'Esta edição não disponibiliza uma descrição suficientemente completa.')+'</div><h3>Dados da edição</h3><p>'+E(v.publisher||'Editora não indicada')+'<br>'+E(v.publishedDate||'Data não indicada')+'</p><h3>Ligações</h3><div class="links"><a target="_blank" href="'+E(v.infoLink||'#')+'">Google Books ↗</a><a target="_blank" href="https://www.google.com/search?q='+encodeURIComponent((v.title||'')+' '+((v.authors||[])[0]||''))+'">Pesquisar na web ↗</a></div></div></section></div>';document.getElementById('cl').onclick=function(){m.innerHTML=''};document.getElementById('ov').onclick=function(e){if(e.target.id==='ov')m.innerHTML=''};document.getElementById('save').onclick=function(){library.unshift({title:v.title||'',author:(v.authors||[]).join(', ')});localStorage.setItem('librarium_rescue',JSON.stringify(library));render()}}
render();
})();
</script>
</body>
</html>
