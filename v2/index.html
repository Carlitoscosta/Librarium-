<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Librarium v2</title><style>:root{--bg:#0d0f0e;--panel:#151816;--panel2:#111411;--ink:#f5f0e4;--mut:#9da198;--gold:#d6b46b;--line:#2d322e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#0d0f0ef2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topin{max-width:1120px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:8px}.brand{font:24px Georgia,serif;margin-right:auto}.nav{border:0;background:transparent;color:var(--mut);padding:8px 10px}.nav.active{color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:30px 16px 80px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:24px;align-items:end;padding:20px 0 26px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--gold)}h1{font:clamp(42px,8vw,72px)/.96 Georgia,serif;margin:10px 0 12px}.hero p,.mut{color:var(--mut)}.dash{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:15px}.stat b{display:block;font:30px Georgia,serif}.stat span{font-size:11px;color:var(--mut)}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:20px 0 12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.search input{width:100%;min-height:50px;background:#fff;color:#111;border:1px solid #777;border-radius:9px;padding:12px 14px;font-size:16px}.primary{min-height:46px;border:0;border-radius:9px;background:#e8dcc0;color:#111;padding:0 18px;font-weight:800}.secondary{border:1px solid #3a403b;background:#1a1e1b;color:#eee;border-radius:8px;padding:9px 11px}.danger{color:#d99}.chips{display:flex;gap:7px;flex-wrap:w ay{padding:0}.modal{min-height:100vh;border-radius:0}.mh{grid-template-columns:105px 1fr;padding:54px 16px 22px;gap:13px}.mh img,.mh .fallback{width:105px;height:158px}.mh h2{font-size:27px}.modalbody{padding:20px 16px}}</style></head><body><header class="top"><div class="topin"><div class="brand">Librarium</div><button class="nav active" data-view="discover">Descobrir</button><button class="nav" data-view="library">Biblioteca <span id="count">0</span></button></div></header><main class="wrap"><section id="discover"><section class="hero"><div><div class="eyebrow">CATÁLOGO PESSOAL</div><h1>Descobre livros.</h1><p>Pesquisa, compara, guarda e acompanha o que estás a ler.</p></div><aside class="dash"><div class="stat"><b id="sTotal">0</b><span>guardados</span></div><div class="stat"><b id="sReading">0</b><span>a ler</span></div><div class="stat"><b id="sRead">0</b><span>lidos</span></div><div class="stat"><b id="sFav">0</b><span>favoritos</span></div></aside></section><form id="form" class="search"><input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="sentences" placeholder="Título, autor, tema ou ISBN"><button type="submit" class="primary">Pesquisar</button></form><div class="chips" id="chips"></div><div class="tools"><select id="lang"><option value="">Todas as línguas</option><option value="pt">Português</option><option value="en">Inglês</option></select><select id="order"><option value="relevance">Relevância</option><option value="newest">Mais recentes</option></select><select id="quality"><option value="all">Todos</option><option value="cover">Com capa</option><option value="desc">Com descrição</option></select></div><div class="status" id="status">Pronto.</div><section class="grid" id="grid"></section></section><section id="library" class="hidden"><div class="eyebrow">BIBLIOTECA</div><h2 class="paneltitle">A minha biblioteca</h2><p class="mut">Estados de leitura, progresso, favoritos e notas pessoais.</p><div class="tools"><select id="libFilter"><option>Todos</option><option>Quero ler</option><option>A ler</option><option>Li</option><option>Tenho</option><option>Favorito</option></select><select id="libSort"><option value="recent">Adicionados recentemente</option><option value="title">Título</option><option value="rating">Minha avaliação</option></select><button class="secondary" id="export">Exportar biblioteca</button></div><section id="libgrid" class="libgrid"></section></section></main><div id="modal"></div><script>(function(){var books=[],selected=null,tab='resumo',KEY='librarium_v2_stable',library=[];try{library=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}function $(x){return document.getElementById(x)}function e(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}function cover(v){var x=v.imageLinks||{};return String(x.extraLarge||x.large||x.medium||x.small||x.thumbnail||x.smallThumbnail||'').replace('http:','https:')}function idBook(v){return norm((v.title||'')+'|'+((v.authors||[])[0]||''))}function persist(){localStorage.setItem(KEY,JSON.stringify(library));stats()}function findSaved(v){var k=idBook(v);return library.find(function(x){return x.key===k})}function saveBook(v){var k=idBook(v),x=findSaved(v),c=cover(v);if(x)return;x={key:k,title:v.title||'',author:(v.authors||[]).join(', '),cover:c,year:(v.publishedDate||'').slice(0,4),status:'Quero ler',progress:0,rating:0,notes:'',isbn:(v.industryIdentifiers||[])[0]?v.industryIdentifiers[0].identifier:''};library.unshift(x);persist();renderBooks();renderLibrary()}function removeBook(k){library=library.filter(function(x){return x.key!==k});persist();renderBooks();renderLibrary()}function stats(){$('count').textContent=library.length;$('sTotal').textContent=library.length;$('sReading').textContent=library.filter(function(x){return x.status==='A ler'}).length;$('sRead').textContent=library.filter(function(x){return x.status==='Li'}).length;$('sFav').textContent=library.filter(function(x){return x.status==='Favorito'}).length}function renderBooks(){if(!books.length){$('grid').innerHTML='';return}$('grid').innerHTML=books.map(function(b,i){var v=b.volumeInfo||{},c=cover(v),saved=!!findSaved(v);return'<article class="book" data-i="'+i+'"><div class="cover">'+(c?'<img src="'+e(c)+'">':'<div class="fallback">'+e(v.title||'Livro')+'</div>')+'<button class="save '+(saved?'on':'')+'" data-save="'+i+'">'+(saved?'✓':'＋')+'</button></div><h2>'+e(v.title||'Sem título')+'</h2><small>'+e((v.authors||['Autor desconhecido']).join(', '))+'</small><div class="meta"><span>'+e((v.publishedDate||'—').slice(0,4))+'</span><span>'+(v.averageRating?'★ '+e(v.averageRating):(v.language||'').toUpperCase())+'</span></div>'+(v.description?'<div class="snippet">'+e(v.description)+'</div>':'')+'</article>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(x){x.onclick=function(ev){if(ev.target.closest('[data-save]'))return;openBook(+x.getAttribute('data-i'))}});Array.prototype.forEach.call(document.querySelectorAll('[data-save]'),function(x){x.onclick=function(ev){ev.stopPropagation();var i=+x.getAttribute('data-save'),v=(books[i]||{}).volumeInfo||{},s=findSaved(v);if(s)removeBook(s.key);else saveBook(v)}})}async function search(){var q=$('q').value.trim(),lang=$('lang').value,order=$('order').value,quality=$('quality').value;if(!q){$('status').textContent='Escreve algo para pesquisar.';return}$('status').textContent='A pesquisar…';$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">A procurar livros…</div>';try{var url='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=40&printType=books'+(lang?'&langRestrict='+lang:'')+(order==='newest'?'&orderBy=newest':'');var r=await fetch(url);var j=await r.json();books=j.items||[];if(quality==='cover')books=boo etAttribute('data-status')});if(x)x.status=n.value;persist();renderLibrary()}});Array.prototype.forEach.call(document.querySelectorAll('[data-rating]'),function(n){n.onchange=function(){var x=library.find(function(z){return z.key===n.getAttribute('data-rating')});if(x)x.rating=+n.value;persist()}});Array.prototype.forEach.call(document.querySelectorAll('[data-progress]'),function(n){n.oninput=function(){var x=library.find(function(z){return z.key===n.getAttribute('data-progress')});if(x)x.progress=+n.value;persist();var bar=n.previousElementSibling;if(bar&&bar.firstElementChild)bar.firstElementChild.style.width=n.value+'%'}});Array.prototype.forEach.call(document.querySelectorAll('[data-notes]'),function(n){n.onchange=function(){var x=library.find(function(z){return z.key===n.getAttribute('data-notes')});if(x)x.notes=n.value;persist()}});Array.prototype.forEach.call(document.querySelectorAll('[data-remove]'),function(n){n.onclick=function(){removeBook(n.getAttribute('data-remove'))}})}function openBook(i){selected=(books[i]||{}).volumeInfo||{};tab='resumo';renderModal()}function renderModal(){var v=selected||{},c=cover(v),saved=findSaved(v),content='';if(tab==='resumo')content='<h3>Resumo / descrição</h3><div class="desc">'+e(v.description||'Sem descrição disponível para esta edição.')+'</div>';if(tab==='dados')content='<h3>Dados da edição</h3><p class="mut">Editora: '+e(v.publisher||'Não indicada')+'<br>Data: '+e(v.publishedDate||'Não indicada')+'<br>Páginas: '+e(v.pageCount||'—')+'<br>Idioma: '+e((v.language||'—').toUpperCase())+'<br>ISBN: '+e((v.industryIdentifiers||[]).map(function(x){return x.identifier}).join(', ')||'—')+'</p>';if(tab==='temas')content='<h3>Temas</h3><p class="mut">'+e((v.categories||[]).join(' · ')||'Sem classificação temática disponível.')+'</p>';if(tab==='lojas'){var q=encodeURIComponent((v.title||'')+' '+((v.authors||[])[0]||''));content='<h3>Onde procurar</h3><div class="links"><a target="_blank" href="https://www.wook.pt/pesquisa/'+q+'">Wook ↗</a><a target="_blank" href="https://www.bertrand.pt/pesquisa/'+q+'">Bertrand ↗</a><a target="_blank" href="https://www.google.com/search?q='+q+' livro comprar">Pesquisar na web ↗</a></div>'}if(tab==='notas')content='<h3>Notas pessoais</h3>'+(saved?'<textarea class="notearea" id="modalNotes" placeholder="Escreve notas sobre este livro">'+e(saved.notes||'')+'</textarea><p><button class="secondary" id="saveNotes">Guardar notas</button></p>':'<p class="mut">Guarda primeiro o livro na biblioteca para poderes escrever notas.</p>');$('modal').innerHTML='<div class="overlay" id="ov"><section class="modal"><button class="close" id="cl">×</button><div class="mh">'+(c?'<img src="'+e(c)+'">':'<div class="fallback">'+e(v.title||'Livro')+'</div>')+'<div><div class="eyebrow">'+e((v.categories||['LIVRO']).slice(0,2).join(' · '))+'</div><h2>'+e(v.title||'Sem título')+'</h2><p class="mut">'+e((v.authors||['Autor desconhecido']).join(', '))+'</p><div class="facts"><span>'+e((v.publishedDate||'—').slice(0,4))+'</span><span>'+e(v.pageCount||'—')+' págs.</span><span>'+e((v.language||'—').toUpperCase())+'</span><span>'+(v.averageRating?'★ '+e(v.averageRating):'Sem nota')+'</span></div><p><button class="primary" id="modalSave" style="padding:10px 14px">'+(saved?'Retirar da biblioteca':'Guardar na biblioteca')+'</button></p></div></div><div class="modalbody"><div class="tabs">'+[['resumo','Resumo'],['dados','Dados'],['temas','Temas'],['lojas','Lojas'],['notas','Notas']].map(function(x){return'<button class="tab '+(tab===x[0]?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+content+'</div></section></div>';$('cl').onclick=function(){$('modal').innerHTML=''};$('ov').onclick=function(x){if(x.target.id==='ov')$('modal').innerHTML=''};$('modalSave').onclick=function(){var s=findSaved(v);if(s)removeBook(s.key);else saveBook(v);renderModal()};Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'),function(x){x.onclick=function(){tab=x.getAttribute('data-tab');renderModal()}});if($('saveNotes'))$('saveNotes').onclick=function(){var s=findSaved(v);if(s){s.notes=$('modalNotes').value;persist()}}}function switchView(v){$('discover').classList.toggle('hidden',v!=='discover');$('library').classList.toggle('hidden',v!=='library');Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(x){x.classList.toggle('active',x.getAttribute('data-view')===v)});if(v==='library')renderLibrary()}$('form').onsubmit=function(x){x.preventDefault();search()};var topics=['História','Filosofia','Ciência','Música','Arqueologia','Mitologia','Psicologia','Biografia','Astronomia','Religião'];$('chips').innerHTML=topics.map(function(t){return'<button type="button" class="chip" data-t="'+t+'">'+t+'</button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(x){x.onclick=function(){$('q').value=x.getAttribute('data-t');search()}});Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(x){x.onclick=function(){switchView(x.getAttribute('data-view'))}});$('libFilter').onchange=renderLibrary;$('libSort').onchange=renderLibrary;$('export').onclick=function(){var blob=new Blob([JSON.stringify(library,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='librarium-biblioteca.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};stats();renderLibrary()})();</script></body></html>
