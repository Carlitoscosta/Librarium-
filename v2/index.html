<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Librarium v2</title><style>body{margin:0;background:#0d0f0e;color:#f5f0e4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}header{padding:15px 16px;border-bottom:1px solid #2d322e;font:24px Georgia,serif}.wrap{max-width:1050px;margin:auto;padding:32px 16px}h1{font:clamp(42px,8vw,70px)/.96 Georgia,serif;margin:10px 0}p{color:#9da198}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:25px 0;padding:10px;border:1px solid #2d322e;border-radius:12px;background:#111411}.search input{width:100%;min-height:50px;background:#fff;color:#111;border:1px solid #777;border-radius:9px;padding:12px 14px;font-size:16px}.search button{min-height:50px;border:0;border-radius:9px;background:#e8dcc0;color:#111;padding:0 18px;font-weight:800}.status{color:#9da198;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px}.book{cursor:pointer}.cover{aspect-ratio:2/3;background:#1a1d1b;border-radius:8px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.fallback{height:100%;display:grid;place-items:center;padding:12px;text-align:center;color:#8d846d;font:18px Georgia,serif}.book h2{font:17px Georgia,serif;margin:8px 0 4px}.book small{color:#9da198}.src{font-size:10px;color:#d6b46b;margin-top:5px}.overlay{position:fixed;inset:0;background:#000d;overflow:auto;padding:18px;z-index:20}.modal{max-width:780px;margin:auto;background:#151816;border:1px solid #2d322e;border-radius:14px;padding:26px;position:relative}.close{position:absolute;right:12px;top:12px;background:#222;color:#fff;border:1px solid #444;border-radius:50%;width:40px;height:40px}.desc{font:16px/1.65 Georgia,serif;color:#c5c9c1}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#151816;color:#ddd;border:1px solid #2d322e;border-radius:99px;padding:8px 11px}@media(max-width:650px){.search{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.overlay{padding:0}.modal{min-height:100vh;border-radius:0}}</style></head><body><header>Librarium</header><main class="wrap"><h1>Descobre livros.</h1><p>Pesquisa por título, autor, tema ou ISBN.</p><form id="form" class="search"><input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Escreve aqui"><button type="submit">Pesquisar</button></form><div class="chips" id="chips"></div><div class="status" id="status">Pronto.</div><section class="grid" id="grid"></section></main><div id="modal"></div><script>(function(){var books=[];function $(x){return document.getElementById(x)}function e(s){return String(s||'').replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}function cover(v){var x=v.imageLinks||{};return String(x.thumbnail||x.smallThumbnail||'').replace('http:','https:')}function fromGoogle(x){return{volumeInfo:x.volumeInfo||{},source:'Google Books'}}function fromOL(d){return{volumeInfo:{title:d.title||'',authors:d.author_name||[],publishedDate:d.first_publish_year?String(d.first_publish_year):'',publisher:(d.publisher&&d.publisher[0])||'',pageCount:d.number_of_pages_median||'',language:(d.language&&d.language[0])||'',description:(d.first_sentence&&d.first_sentence[0])||'',categories:(d.subject||[]).slice(0,8),imageLinks:d.cover_i?{thumbnail:'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg?default=false'}:{}},source:'Open Library'}}function key(b){var v=b.volumeInfo||{};return norm((v.title||'')+'|'+((v.authors||[])[0]||''))}function render(){if(!books.length){$('grid').innerHTML='';return}$('grid').innerHTML=books.map(function(b,i){var v=b.volumeInfo||{},c=cover(v);return'<article class="book" data-i="'+i+'"><div class="cover">'+(c?'<img src="'+e(c)+'">':'<div class="fallback">'+e(v.title||'Livro')+'</div>')+'</div><h2>'+e(v.title||'Sem título')+'</h2><small>'+e((v.authors||['Autor desconhecido']).join(', '))+'</small><div class="src">'+e(b.source||'')+'</div></article>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(x){x.onclick=function(){openBook(+x.getAttribute('data-i'))}})}async function getGoogle(q){var r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=40&printType=books');if(!r.ok)throw Error('google '+r.status);var j=await r.json();return(j.items||[]).map(fromGoogle)}async function getOL(q){var r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=50');if(!r.ok)throw Error('ol '+r.status);var j=await r.json();return(j.docs||[]).map(fromOL)}async function search(){var q=$('q').value.trim();if(!q){$('status').textContent='Escreve algo para pesquisar.';return}$('status').textContent='A pesquisar em duas bibliotecas…';$('grid').innerHTML='';var rs=await Promise.allSettled([getGoogle(q),getOL(q)]),all=[];rs.forEach(function(r){if(r.status==='fulfilled')all=all.concat(r.value)});var m=new Map();all.forEach(function(b){var v=b.volumeInfo||{};if(!v.title)return;var k=key(b);if(!m.has(k))m.set(k,b);else{var old=m.get(k),ov=old.volumeInfo||{};if(!cover(ov)&&cover(v))ov.imageLinks=v.imageLinks;if(!ov.description&&v.description)ov.description=v.description;if(!ov.publisher&&v.publisher)ov.publisher=v.publisher;if(!ov.pageCount&&v.pageCount)ov.pageCount=v.pageCount;old.source='Google + Open Library'}});books=Array.from(m.values()).slice(0,60);var ok=rs.filter(function(r){return r.status==='fulfilled'}).length;if(!ok){$('status').textContent='As fontes de livros não responderam. Tenta novamente dentro de alguns segundos.';return}$('status').textContent=books.length?books.length+' resultados.':'As fontes responderam, mas não encontraram livros para esta pesquisa.';render()}function openBook(i){var b=books[i]||{},v=b.volumeInfo||{},c=cover(v);$('modal').innerHTML='<div class="overlay" id="ov"><section class="modal"><button class="close" id="cl">×</button>'+(c?'<img src="'+e(c)+'" style="width:120px;border-radius:7px">':'')+'<h2>'+e(v.title||'Sem título')+'</h2><p>'+e((v.authors||[]).join(', '))+'</p><p style="color:#d6b46b;font-size:12px">'+e(b.source||'')+'</p><h3>Resumo / descrição</h3><div class="desc">'+e(v.description||'Sem descrição disponível para esta edição.')+'</div><h3>Dados</h3><p>'+e(v.publisher||'Editora não indicada')+'<br>'+e(v.publishedDate||'Data não indicada')+(v.pageCount?'<br>'+e(v.pageCount)+' páginas':'')+'</p></section></div>';$('cl').onclick=function(){$('modal').innerHTML=''};$('ov').onclick=function(x){if(x.target.id==='ov')$('modal').innerHTML=''}}$('form').onsubmit=function(x){x.preventDefault();search()};var topics=['História','Filosofia','Ciência','Música','Arqueologia','Mitologia','Psicologia','Biografia'];$('chips').innerHTML=topics.map(function(t){return'<button type="button" class="chip" data-t="'+t+'">'+t+'</button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(x){x.onclick=function(){$('q').value=x.getAttribute('data-t');search()}})})();</script></body></html>
