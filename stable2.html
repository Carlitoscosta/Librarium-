<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Librarium</title><style>body{margin:0;background:#0d0f0e;color:#f4efe3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}.wrap{max-width:1000px;margin:auto;padding:28px 16px}h1{font:52px Georgia,serif;margin:10px 0}p{color:#9da198}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:24px 0}.search input{background:#0e110f;color:#fff;border:1px solid #303530;border-radius:8px;padding:13px}.search button{background:#e8dcc0;color:#111;border:0;border-radius:8px;padding:0 18px;font-weight:700}.status{padding:12px 0;border-bottom:1px solid #2c302d;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 14px}.book img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#1a1d1b}.book h2{font:17px/1.18 Georgia,serif;margin:8px 0 4px}.book p{font-size:12px;margin:0}.meta{font-size:11px;color:#9da198;margin-top:6px}.tag{display:inline-block;font-size:10px;color:#d6b46b;margin-top:4px}@media(max-width:700px){h1{font-size:42px}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><small style="color:#d6b46b">LIBRARIUM TESTE 2</small><h1>Pesquisa de livros</h1><p>Pesquisa por título, autor ou tema. O Librarium tenta também equivalentes internacionais quando isso melhora os resultados.</p><form class="search" id="f"><input id="q" placeholder="Ex.: conspiração, Os Maias, Saramago"><button>Pesquisar</button></form><div id="status" class="status">Pronto.</div><section id="results" class="grid"></section></main><script>(function(){var aliases={"conspiracao":["conspiracy","conspiracy theories"],"conspiracoes":["conspiracy","conspiracy theories"],"historia":["history"],"filosofia":["philosophy"],"arqueologia":["archaeology"],"mitologia":["mythology"],"astronomia":["astronomy"],"ciencia":["science"],"musica":["music"]};function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}function esc(s){return String(s==null?"":s).replace(/[&<>\"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}function cover(v){var x=v.imageLinks||{};return String(x.thumbnail||x.smallThumbnail||"").replace("http:","https:")}function key(v){return norm((v.title||"")+"|"+((v.authors||[])[0]||""))}function good(v){return !!(v.title&&v.authors&&v.authors.length&&cover(v))}async function fetchBooks(term){var u="https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent(term)+"&maxResults=40&printType=books";var r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);var j=await r.json();return j.items||[]}async function search(){var raw=document.getElementById("q").value.trim();var status=document.getElementById("status");var out=document.getElementById("results");if(!raw){status.textContent="Escreve uma pesquisa.";out.innerHTML="";return}status.textContent="A procurar…";out.innerHTML="";var n=norm(raw),terms=[raw];if(n!==raw.toLowerCase())terms.push(n);if(aliases[n])terms=terms.concat(aliases[n]);var all=[];for(var i=0;i<terms.length;i++){try{var got=await fetchBooks(terms[i]);all=all.concat(got)}catch(e){}}var seen={},books=[];for(var j=0;j<all.length;j++){var v=all[j].volumeInfo||{};if(!good(v))continue;var k=key(v);if(seen[k])continue;seen[k]=1;books.push(v)}books=books.slice(0,40);status.textContent=books.length?books.length+" resultados com capa e autor.":"Não encontrei resultados completos. Experimenta outro termo.";out.innerHTML=books.map(function(v){var y=(v.publishedDate||"").slice(0,4)||"—";return '<article class="book"><img loading="lazy" src="'+esc(cover(v))+'"><h2>'+esc(v.title)+'</h2><p>'+esc((v.authors||[]).join(", "))+'</p><div class="meta">'+esc(y)+(v.publisher?' · '+esc(v.publisher):'')+'</div>'+(v.averageRating?'<span class="tag">★ '+esc(v.averageRating)+'</span>':'')+'</article>'}).join("")}document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();search()});})();</script></body></html>
