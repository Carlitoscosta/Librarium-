<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Librarium</title><style>:root{--bg:#0d0f0e;--p:#151816;--ink:#f4efe3;--mut:#9da198;--gold:#d6b46b;--line:#2c302d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;background:#0d0f0eee;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}.brand{font:22px Georgia,serif;background:0;border:0;color:var(--ink)}.pill{background:#1b1f1c;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 12px}.hero{max-width:1050px;margin:auto;padding:50px 18px 24px}.hero small{color:var(--gold);letter-spacing:.18em}.hero h1{font:clamp(42px,8vw,84px)/.96 Georgia,serif;margin:14px 0}.hero p{max-width:730px;color:var(--mut);line-height:1.6}.search{max-width:1050px;margin:0 auto 25px;padding:12px;display:grid;grid-template-columns:2fr 1fr auto;gap:9px;background:#121513;border:1px solid var(--line);border-radius:13px}.search input{background:#0e110f;border:1px solid #303530;border-radius:8px;color:var(--ink);padding:12px;min-width:0}.go{background:#e8dcc0;color:#161713;font-weight:800;border:0;border-radius:8px;padding:0 16px}.status{max-width:1050px;margin:0 auto 16px;padding:0 4px 12px;border-bottom:1px solid var(--line);color:#c2c6bf}.grid{max-width:1050px;margin:auto;padding:0 14px 70px;display:grid;grid-template-columns:repeat(4,1fr);gap:25px 16px}.book{cursor:pointer}.cover{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#1a1d1b;box-shadow:0 15px 35px #0005;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;left:7px;top:7px;background:#0b0d0bd9;border:1px solid #ffffff20;border-radius:99px;padding:5px 7px;font-size:9px;letter-spacing:.04em}.save{position:absolute;right:7px;top:7px;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff25;background:#111d;color:white}.saved{background:#e8dcc0;color:#111}.book h2{font:18px/1.17 Georgia,serif;margin:10px 0 5px}.book p{font-size:12px;color:var(--mut);margin:0}.meta{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}.overlay{position:fixed;inset:0;z-index:20;background:#000d;overflow:auto;padding:20px}.modal{max-width:900px;margin:auto;background:#121513;border:1px solid var(--line);border-radius:15px;position:relative;overflow:hidden}.x{position:absolute;z-index:2;right:12px;top:12px;width:42px;height:42px;border-radius:50%;background:#171b18;color:#fff;border:1px solid #39403a;font-size:24px}.mh{display:grid;grid-template-columns:180px 1fr;gap:25px;padding:45px;background:#171a16}.mh img{width:180px;height:270px;object-fit:cover;border-radius:7px}.mh h1{font:42px/1 Georgia,serif;margin:8px 0}.mh p{color:var(--mut)}.facts{display:flex;flex-wrap:wrap;gap:7px}.facts span{font-size:11px;border:1px solid #343a35;border-radius:99px;padding:7px 9px}.body{display:grid;grid-template-columns:1.6fr .8fr;gap:34px;padding:35px 45px}.body h3{font:23px Georgia,serif;border-bottom:1px solid var(--line);padding-bottom:9px}.desc{font:16px/1.65 Georgia,serif;color:#bcc0b8}.stores a{display:flex;justify-content:space-between;color:#d0d3cd;text-decoration:none;border-bottom:1px solid var(--line);padding:10px 0;font-size:12px}.stores b{color:var(--gold)}.lib{max-width:1050px;margin:auto;padding:45px 18px}.lib h1{font:54px Georgia,serif}.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{display:grid;grid-template-columns:68px 1fr;gap:12px;border:1px solid var(--line);padding:10px;border-radius:10px}.item img{width:68px;height:102px;object-fit:cover}.item h3{font:18px Georgia,serif;margin:4px 0}.item p{font-size:12px;color:var(--mut)}@media(max-width:760px){.search{margin:0 12px 25px;grid-template-columns:1fr}.go{height:44px}.grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}.status{margin:0 14px 16px}.mh{grid-template-columns:105px 1fr;padding:55px 16px 24px;gap:14px}.mh img{width:105px;height:158px}.mh h1{font-size:28px}.body{grid-template-columns:1fr;padding:22px 17px}.overlay{padding:0}.modal{min-height:100vh;border-radius:0}.shelf{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const EN={conspiracao:['conspiracy','conspiracy theories'],conspiracoes:['conspiracy','conspiracy theories'],arqueologia:['archaeology'],civilizacao:['civilization'],civilizacoes:['civilizations'],historia:['history'],filosofia:['philosophy'],mitologia:['mythology'],religiao:['religion'],astronomia:['astronomy'],musica:['music'],ciencia:['science'],politica:['politics']};let s={tab:'d',q:'',author:'',books:[],sel:null,note:'',lib:[]};try{s.lib=JSON.parse(localStorage.getItem('librarium')||'[]')}catch{}function persist(){localStorage.setItem('librarium',JSON.stringify(s.lib))}function cov(b){return b.cover||''}function key(b){return norm(b.title+'|'+(b.authors?.[0]||''))}function score(b){let n=0;if(b.cover)n+=4;if(b.title)n+=2;if(b.authors?.length)n+=3;if(b.year)n+=2;if(b.publisher)n+=1;if(b.isbn)n+=2;if(b.description)n+=3;if(b.pages)n+=1;if(b.rating)n+=1;return n}function fromGoogle(x){let v=x.volumeInfo||{},id=(v.industryIdentifiers||[]).find(i=>i.type==='ISBN_13')?.identifier||(v.industryIdentifiers||[])[0]?.identifier||'';return{id:'g_'+x.id,source:'Google Books',title:v.title||'',authors:v.authors||[],year:(v.publishedDate||'').slice(0,4),date:v.publishedDate||'',publisher:v.publisher||'',pages:v.pageCount||'',language:v.language||'',isbn:id,description:v.description||'',rating:v.averageRating||'',ratingsCount:v.ratingsCount||'',categories:v.categories||[],cover:(v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail||'').replace('http:','https:'),info:v.infoLink||''}}function fromOL(d){return{id:'o_'+(d.key||Math.random()),source:'Open Library',title:d.title||'',authors:d.author_name||[],year:d.first_publish_year?String(d.first_publish_year):'',date:d.first_publish_year?String(d.first_publish_year):'',publisher:d.publisher?.[0]||'',pages:d.number_of_pages_median||'',language:d.language?.[0]||'',isbn:d.isbn?.[0]||'',description:'',rating:'',ratingsCount:'',categories:(d.subject||[]).slice(0,5),cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg':'',info:d.key?'https://openlibrary.org'+d.key:''}}function richOL(b){return !!(b.cover&&b.title&&b.authors?.length&&b.year&&(b.publisher||b.isbn||b.pages))}function merge(a,b){let A=score(a)>=score(b)?a:b,B=A===a?b:a;return{...A,cover:A.cover||B.cover,authors:A.authors?.length?A.authors:B.authors,year:A.year||B.year,date:A.date||B.date,publisher:A.publisher||B.publisher,pages:A.pages||B.pages,language:A.language||B.language,isbn:A.isbn||B.isbn,description:A.description||B.description,rating:A.rating||B.rating,ratingsCount:A.ratingsCount||B.ratingsCount,categories:A.categories?.length?A.categories:B.categories,source:A.source===B.source?A.source:'Google + Open Library',info:A.info||B.info}}async function g(q){let r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=40&printType=books');if(!r.ok)throw 0;let j=await r.json();return(j.items||[]).map(fromGoogle)}async function ol(q){let r=await fetch('https://openlibrary.org/search.json?limit=40&q='+encodeURIComponent(q));if(!r.ok)throw 0;let j=await r.json();return(j.docs||[]).map(fromOL).filter(richOL)}async function search(){let raw=s.q.trim(),n=norm(raw),terms=[];if(raw)terms.push(raw);if(n&&n!==raw.toLowerCase())terms.push(n);if(EN[n])terms.push(...EN[n]);if(!terms.length)terms=['best sellers'];let auth=s.author.trim();s.note='A procurar livros com dados completos…';render();let jobs=[];for(let t of terms){jobs.push(g([t,auth?'inauthor:'+auth:''].filter(Boolean).join(' ')));jobs.push(ol([t,auth].filter(Boolean).join(' ')))}let rs=await Promise.allSettled(jobs),all=[];rs.forEach(r=>{if(r.status==='fulfilled')all.push(...r.value)});let map=new Map();for(let b of all){if(!b.title||!b.authors?.length)continue;let k=key(b);map.set(k,map.has(k)?merge(map.get(k),b):b)}s.books=[...map.values()].filter(b=>score(b)>=7).sort((a,b)=>score(b)-score(a)).slice(0,50);s.note=s.books.length?s.books.length+' resultados com informação suficiente':'Nenhum resultado suficientemente completo. Experimenta outro termo.';render()}function save(b){let i={id:b.id,title:b.title,authors:b.authors,cover:b.cover,status:'Quero ler'};let p=s.lib.findIndex(x=>x.id===b.id);p>=0?s.lib[p]=i:s.lib.unshift(i);persist();render()}function del(id){s.lib=s.lib.filter(x=>x.id!==id);persist();render()}function stores(b){let q=encodeURIComponent(b.title+' '+(b.isbn||b.authors?.[0]||''));return[['Google Books',b.info||'https://books.google.com'],['Open Library','https://openlibrary.org/search?q='+q],['Wook','https://www.wook.pt/pesquisa/'+q],['Bertrand','https://www.bertrand.pt/pesquisa/'+q],['FNAC','https://www.fnac.pt/SearchResult/ResultList.aspx?Search='+q],['Amazon ES','https://www.amazon.es/s?k='+q]]}function card(b){let sv=s.lib.some(x=>x.id===b.id);return`<article class="book" onclick="s.sel=s.books.find(x=>x.id==='${b.id}');render()"><div class="cover"><img loading="lazy" src="${esc(b.cover)}"><span class="badge">${esc(b.source)}</span><button class="save ${sv?'saved':''}" onclick="event.stopPropagation();save(s.books.find(x=>x.id==='${b.id}'))">${sv?'✓':'＋'}</button></div><h2>${esc(b.title)}</h2><p>${esc(b.authors.join(', '))}</p><div class="meta"><span>${esc(b.year||'—')}</span><span>${b.rating?'★ '+b.rating:b.publisher?esc(b.publisher):'ISBN '+esc(b.isbn||'—')}</span></div></article>`}function modal(){let b=s.sel;if(!b)return'';return`<div class="overlay" onclick="if(event.target===this){s.sel=null;render()}"><section class="modal"><button class="x" onclick="s.sel=null;render()">×</button><div class="mh"><img src="${esc(b.cover)}"><div><small>${esc(b.source)}</small><h1>${esc(b.title)}</h1><p>${esc(b.authors.join(', '))}</p><div class="facts"><span>${esc(b.year||'—')}</span><span>${esc(b.pages||'—')} págs.</span><span>${esc((b.language||'—').toUpperCase())}</span><span>${b.rating?'★ '+b.rating:'Sem nota'}</span></div><br><button class="go" style="padding:10px 14px" onclick="save(s.sel)">Guardar na biblioteca</button></div></div><div class="body"><main><h3>Sinopse</h3><div class="desc">${b.description||'Esta edição não disponibiliza sinopse na fonte consultada.'}</div><h3>Assuntos</h3><p class="desc">${esc((b.categories||[]).join(' · ')||'Sem classificação temática disponível.')}</p></main><aside><h3>Edição</h3><p>${esc(b.publisher||'Editora não indicada')}<br>${esc(b.date||b.year||'Data não indicada')}<br>ISBN ${esc(b.isbn||'—')}</p><h3>Lojas e fichas</h3><div class="stores">${stores(b).map(x=>`<a target="_blank" href="${esc(x[1])}"><span>${x[0]}</span><b>Abrir ↗</b></a>`).join('')}</div></aside></div></section></div>`}function lib(){return`<section class="lib"><h1>Biblioteca</h1><p>${s.lib.length} livros guardados neste aparelho.</p>${s.lib.length?`<div class="shelf">${s.lib.map(i=>`<div class="item"><img src="${esc(i.cover)}"><div><h3>${esc(i.title)}</h3><p>${esc(i.authors.join(', '))}</p><button class="pill" onclick="del('${i.id}')">Retirar</button></div></div>`).join('')}</div>`:'<p>Ainda não guardaste livros.</p>'}</section>`}function render(){app.innerHTML=`<header class="top"><button class="brand" onclick="s.tab='d';render()">Librarium</button><button class="pill" onclick="s.tab=s.tab==='d'?'l':'d';render()">${s.tab==='d'?'Biblioteca ('+s.lib.length+')':'Descobrir'}</button></header>${s.tab==='d'?`<section class="hero"><small>CATÁLOGO VIVO</small><h1>Encontra livros, não esqueletos.</h1><p>A pesquisa privilegia registos com capa e informação bibliográfica útil, combinando fontes quando isso melhora a ficha.</p></section><form class="search" onsubmit="event.preventDefault();s.q=q.value;s.author=author.value;search()"><input id="q" value="${esc(s.q)}" placeholder="Título, tema ou palavra"><input id="author" value="${esc(s.author)}" placeholder="Autor"><button class="go">Pesquisar</button></form><div class="status">${esc(s.note||'Pronto para pesquisar.')}</div><section class="grid">${s.books.map(card).join('')}</section>`:lib()}${modal()}`}render();</script></body></html>
