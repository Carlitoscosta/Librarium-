<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f0e"><title>Librarium</title><style>:root{--bg:#0d0f0e;--panel:#151816;--panel2:#111411;--ink:#f4efe3;--mut:#9da198;--gold:#d6b46b;--line:#2c302d;--soft:#1b1f1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#0d0f0ef2;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.bar{max-width:1180px;margin:auto;padding:13px 16px;display:flex;align-items:center;gap:10px}.brand{font:24px Georgia,serif;margin-right:auto}.nav{border:0;background:transparent;color:var(--mut);padding:8px 10px}.nav.active{color:var(--ink)}.badge{font-size:11px;background:var(--gold);color:#111;border-radius:99px;padding:2px 7px}.wrap{max-width:1180px;margin:auto;padding:36px 16px 80px}.hero{padding:26px 0 18px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em}.hero h1{font:clamp(43px,7vw,78px)/.95 Georgia,serif;margin:12px 0 14px}.hero p{max-width:760px;color:var(--mut);font-size:16px;line-height:1.6}.searchbox{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:14px}.searchrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px}.searchrow input,.filters input,.filters select,.library-toolbar select{background:#0e110f;color:var(--ink);border:1px solid #303530;border-radius:8px;padding:12px;min-width:0}.primary{background:#e8dcc0;color:#111;border:0;border-radius:8px;padding:0 18px;font-weight:800}.secondary{background:var(--soft);color:var(--ink);border:1px solid #333a34;border-radius:8px;padding:10px 12px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.status{display:flex;justify-content:space-between;gap:12px;align-items:cente nfo&&x.saleInfo.retailPrice;return{id:'g_'+x.id,title:v.title||'',subtitle:v.subtitle||'',authors:v.authors||[],year:yearOf(v),date:v.publishedDate||'',publisher:v.publisher||'',pages:v.pageCount||'',language:v.language||'',isbn:isbnOf(v),description:clean(v.description||''),rating:v.averageRating||'',ratingsCount:v.ratingsCount||'',cover:coverOf(v),subjects:v.categories||[],source:'Google Books',info:v.infoLink||'',price:p?p.amount:'',currency:p?p.currencyCode:'',workKey:''}}function ob(d){return{id:'o_'+(d.key||Math.random()),title:d.title||'',subtitle:d.subtitle||'',authors:d.author_name||[],year:d.first_publish_year?String(d.first_publish_year):'',date:d.first_publish_year?String(d.first_publish_year):'',publisher:(d.publisher&&d.publisher[0])||'',pages:d.number_of_pages_median||'',language:(d.language&&d.language[0])||'',isbn:(d.isbn&&d.isbn[0])||'',description:clean((d.first_sentence&&d.first_sentence[0])||''),rating:'',ratingsCount:'',cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg?default=false':'',subjects:(d.subject||[]).slice(0,12),source:'Open Library',info:d.key?'https://openlibrary.org'+d.key:'',price:'',currency:'',workKey:d.key||''}}function key(b){return norm(b.title+'|'+(b.authors[0]||''))}function score(b){return(b.cover?5:0)+(b.authors.length?3:0)+(b.description.length>100?4:b.description?2:0)+(b.isbn?2:0)+(b.publisher?1:0)+(b.pages?1:0)+(b.year?1:0)+(b.rating?2:0)}function merge(a,b){var A=score(a)>=score(b)?a:b,B=A===a?b:a;return{id:A.id,title:A.title||B.title,subtitle:A.subtitle||B.subtitle,authors:A.authors.length?A.authors:B.authors,year:A.year||B.year,date:A.date||B.date,publisher:A.publisher||B.publisher,pages:A.pages||B.pages,language:A.language||B.language,isbn:A.isbn||B.isbn,description:A.description.length>=B.description.length?A.description:B.description,rating:A.rating||B.rating,ratingsCount:A.ratingsCount||B.ratingsCount,cover:A.cover||B.cover,subjects:A.subjects.length?A.subjects:B.subjects,source:A.source===B.source?A.source:'Google + Open Library',info:A.info||B.info,price:A.price||B.price,currency:A.currency||B.currency,workKey:A.workKey||B.workKey}}async function google(q,lang){var u='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=40&printType=books'+(lang?'&langRestrict='+lang:'');var r=await fetch(u);if(!r.ok)throw Error('Google Books');var j=await r.json();return(j.items||[]).map(gb)}async function openlib(q){var r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=50');if(!r.ok)throw Error('Open Library');var j=await r.json();return(j.docs||[]).map(ob)}async function translate(text){text=clean(text);if(!text)return'';if(/\b(que|para|com|uma|não|mais|como|sobre|dos|das|livro|história|este|esta)\b/i.test(text))return text;try{var parts=[],out=[],max=2800;for(var i=0;i<text.length;i+=max)parts.push(text.slice(i,i+max));for(var p=0;p<parts.length;p++){var r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt&dt=t&q='+encodeURIComponent(parts[p]));if(!r.ok)throw Error('tr');var j=await r.json(),t='';(j[0]||[]).forEach(function(x){if(x&&x[0])t+=x[0]});out.push(t)}return clean(out.join(' '))||text}catch(e){return text}}function langName(x){x=(x||'').toLowerCase();return({pt:'Português',por:'Português',en:'Inglês',eng:'Inglês',es:'Espanhol',spa:'Espanhol',fr:'Francês',fre:'Francês',de:'Alemão',ger:'Alemão',it:'Italiano',ita:'Italiano'})[x]||x.toUpperCase()||'Não indicada'}function persist(){localStorage.setItem('librarium_library_v1',JSON.stringify(state.library))}function savedBook(b){return state.library.some(function(x){return x.key===key(b)})}function saveBook(b,status){var k=key(b),i=state.library.findIndex(function(x){return x.key===k}),item={key:k,title:b.title,authors:b.authors,cover:b.cover,year:b.year,isbn:b.isbn,status:status||'Quero ler'};if(i>=0)state.library[i]=Object.assign({},state.library[i],item);else state.library.unshift(item);persist();render()}function removeBook(k){state.library=state.library.filter(function(x){return x.key!==k});persist();render()}function setStatus(k,v){var x=state.library.find(function(y){return y.key===k});if(x)x.status=v;persist();render()}function currency(b){if(!b.price)return'';try{return new Intl.NumberFormat('pt-PT',{style:'currency',currency:b.currency||'EUR'}).format(b.price)}catch(e){return b.price+' '+(b.currency||'')}}async function search(){state.query=document.getElementById('q').value.trim();state.author=document.getElementById('author').value.trim();state.year=document.getElementById('year').value.trim();state.lang=document.getElementById('lang').value;state.sort=document.getElementById('sort').value;if(!state.query&&!state.author){state.status='Escreve um título, autor, tema ou ISBN.';render();return}state.status='A procurar em várias edições…';render();var base=state.query||'',n=norm(base),terms=[base];if(aliases[n])terms=terms.concat(aliases[n]);if(/^97[89]\d{10}$/.test(base.replace(/\D/g,'')))terms=['isbn:'+base.replace(/\D/g,'')];var jobs=[];terms.forEach(function(t){var q=[t,state.author?'inauthor:'+state.author:''].filter(Boolean).join(' ');jobs.push(google(q,state.lang==='Português'?'pt':''));jobs.push(google(q,''));jobs.push(openlib([t,state.author].filter(Boolean).join(' ')))});var rs=await Promise.allSettled(jobs),all=[];rs.forEach(function(r){if(r.status==='fulfilled')all=all.concat(r.value)});var map=new Map();all.forEach(function(b){if(!b.title||!b.authors.length)return;var k=key(b);map.set(k,map.has(k)?merge(map.get(k),b):b)});var arr=Array.from(map.values());if(state.year)arr=arr.filter(function(b){return b.year===state.year});if(state.lang!=='Todos')arr=arr.filter(function(b){return langName(b.language)===state.lang});if(state.sort==='ano-desc')arr.sort(function(a,b){return Number(b.year||0)-Number(a.year||0)});else if(state.sort==='ano-asc')arr.sort(function(a,b){return Number(a.year||9999)-Number(b.year||9999)});else if(state.sort==='avaliacao')arr.sort(function(a,b){return Number(b.rating||0)-Number(a.rating||0)});else arr.sort(function(a,b){return score(b)-score(a)});state.books=arr.slice(0,80);state.status=state.books.length?state.books.length+' resultados.':'Não encontrei resultados com estes filtros.';render()}async function enrich(b){var candidates=[b.description||''],editions=[],qs=[];if(b.isbn)qs.push('isbn:'+b.isbn);qs.push('intitle:'+b.title+(b.authors[0]?' inauthor:'+b.authors[0]:''));for(var q=0;q<qs.length;q++){try{var arr=(await google(qs[q],''));arr.forEach(function(x){if(x.description)candidates.push(x.description);if(x.title&&x.authors.length)editions.push(x);if(!b.cover&&x.cover)b.cover=x.cover;if(!b.isbn&&x.isbn)b.isbn=x.isbn;if(!b.publisher&&x.publisher)b.publisher=x.publisher;if(!b.pages&&x.pages)b.pages=x.pages})}catch(e){}}try{var r=await fetch('https://openlibrary.org/search.json?title='+encodeURIComponent(b.title)+(b.authors[0]?'&author='+encodeURIComponent(b.authors[0]):'')+'&limit=20');if(r.ok){var j=await r.json(),docs=j.docs||[];docs.forEach(function(d){var x=ob(d);editions.push(x);if(x.description)candidates.push(x.description);if(!b.cover&&x.cover)b.cover=x.cover;if(!b.workKey&&x.workKey)b.workKey=x.workKey})}if(b.workKey&&b.workKey.indexOf('/works/')===0){var wr=await fetch('https://openlibrary.org'+b.workKey+'.json');if(wr.ok){var w=await wr.json(),d=w.description;if(typeof d==='object')d=d.value;if(d)candidates.push(clean(d));if(w.subjects)b.subjects=w.subjects.slice(0,12)}}}catch(e){}candidates=candidates.filter(Boolean).sort(function(a,b){return b.length-a.length});b.descriptionOriginal=candidates[0]||'';b.descriptionPT=await translate(b.descriptionOriginal);if(b.subjects.length)b.subjectsPT=await translate(b.subjects.slice(0,10).join(' · '));var emap=new Map();editions.forEach(function(x){var k=(x.isbn||'')+'|'+x.year+'|'+x.publisher;if(!emap.has(k))emap.set(k,x)});b.editions=Array.from(emap.values()).slice(0,10);try{var rel=await google('subject:'+(b.subjects[0]||b.title)+' -intitle:'+b.title,'');b.related=rel.filter(function(x){return norm(x.title)!==norm(b.title)&&x.cover}).slice(0,8)}catch(e){b.related=[]}return b}async function openBook(i){var b=state.books[i];state.selected=b;render();await enrich(b);state.selected=b;render()}function stores(b){var q=encodeURIComponent(b.title+' '+(b.isbn||b.authors[0]||''));return[['Google Books','Abrir',b.info||'https://books.google.com/?q='+q],['Open Library','Procurar','https://openlibrary.org/search?q='+q],['Wook','Consultar','https://www.wook.pt/pesquisa/'+q],['Bertrand','Consultar','https://www.bertrand.pt/pesquisa/'+q],['FNAC','Consultar','https://www.fnac.pt/SearchResult/ResultList.aspx?Search='+q],['Amazon ES','Consultar','https://www.amazon.es/s?k='+q]]}function card(b,i){return'<article class="book"><div class="cover" onclick="openBook('+i+')">'+(b.cover?'<img loading="lazy" src="'+esc(b.cover)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="noc" style="display:none">'+esc((b.title||'L')[0])+'</div>':'<div class="noc">'+esc((b.title||'L')[0])+'</div>')+'<button class="quick '+(savedBook(b)?'saved':'')+'" onclick="event.stopPropagation();saveBook(state.books['+i+'])">'+(savedBook(b)?'✓':'＋')+'</button></div><div class="bookbody"><h2 onclick="openBook('+i+')">'+esc(b.title)+'</h2><p>'+esc(b.authors.join(', '))+'</p><div class="mini"><span>'+esc(b.year||'—')+'</span><span>'+(b.price?esc(currency(b)):b.rating?'★ '+esc(b.rating):'')+'</span></div><div class="src">'+esc(b.source)+'</div></div></article>'}function modal(){var b=state.selected;if(!b)return'';var loading=!b.editions;var desc=b.descriptionPT||b.description||'';return'<div class="overlay" id="overlay"><section class="modal"><button class="close" onclick="state.selected=null;render()">×</button><div class="mh">'+(b.cover?'<img src="'+esc(b.cover)+'">':'<div class="noc">'+esc((b.title||'L')[0])+'</div>')+'<div><span class="eyebrow">'+esc(b.source)+'</span><h1>'+esc(b.title)+'</h1>'+(b.subtitle?'<p>'+esc(b.subtitle)+'</p>':'')+'<div class="author">'+esc(b.authors.join(', '))+'</div><div class="facts"><span>'+esc(b.year||'—')+'</span><span>'+esc(b.pages||'—')+' págs.</span><span>'+esc(langName(b.language))+'</span><span>'+(b.rating?'★ '+esc(b.rating)+(b.ratingsCount?' ('+esc(b.ratingsCount)+')':''):'Sem nota')+'</span></div><div class="actions"><button class="primary" style="padding:10px 14px" onclick="saveBook(state.selected)">'+(savedBook(b)?'Actualizar biblioteca':'Guardar na biblioteca')+'</button><button class="secondary" onclick="document.getElementById(\'editions\').scrollIntoView({behavior:\'smooth\'})">Comparar edições</button></div></div></div><div class="body"><main><h3>Resumo / descrição</h3>'+(loading?'<p class="loading">A procurar a melhor descrição em várias edições e a preparar a versão portuguesa…</p>':'')+'<div class="desc">'+esc(desc||'Não foi encontrada uma descrição suficientemente completa nas fontes consultadas.')+'</div>'+(!loading&&b.descriptionOriginal&&b.descriptionPT&&b.descriptionOriginal!==b.descriptionPT?'<p class="note">Tradução automática para português a partir da descrição editorial disponível.</p>':'')+'<h3>Assuntos</h3><p class="desc">'+esc(b.subjectsPT||b.subjects.join(' · ')||'Sem classificação temática disponível.')+'</p><h3 id="editions">Edições encontradas</h3><div class="editions">'+(loading?'<p class="loading">A procurar outras edições…</p>':(b.editions&&b.editions.length?b.editions.map(function(x){return'<div class="edition"><strong>'+esc(x.title)+'</strong>'+esc(x.publisher||'Editora não indicada')+' · '+esc(x.year||'Data não indicada')+'<br>'+esc(x.pages||'—')+' págs. · ISBN '+esc(x.isbn||'—')+'</div>'}).join(''):'<p class="note">Não foram encontradas outras edições com dados suficientes.</p>'))+'</div><h3>Livros relacionados</h3><div class="related">'+(loading?'<p class="loading">A procurar recomendações…</p>':(b.related||[]).map(function(x){return'<button onclick="state.query='+JSON.stringify(x.title)+';state.selected=null;state.tab=\'discover\';render();document.getElementById(\'q\').value='+JSON.stringify(x.title)+';search()">'+(x.cover?'<img src="'+esc(x.cover)+'">':'')+'<span>'+esc(x.title)+'</span></button>'}).join(''))+'</div></main><aside><h3>Dados da edição</h3><p>'+esc(b.publisher||'Editora não indicada')+'<br>'+esc(b.date||b.year||'Data não indicada')+'<br>ISBN '+esc(b.isbn||'—')+'<br>'+esc(b.pages||'—')+' páginas<br>'+esc(langName(b.language))+'</p><h3>Preço e lojas</h3>'+(b.price?'<p><strong>'+esc(currency(b))+'</strong></p>':'<p class="note">O preço não está disponível nesta fonte. Consulta as lojas.</p>')+'<div class="links">'+stores(b).map(function(x){return'<a target="_blank" href="'+esc(x[2])+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></a>'}).join('')+'</div></aside></div></section></div>'}function discover(){return'<main class="wrap"><section class="hero"><span class="eyebrow">LIBRARIUM 1.0</span><h1>Descobre, compara e organiza livros.</h1><p>Pesquisa por título, autor, tema ou ISBN. O Librarium cruza várias edições, tenta recuperar capas e descrições, traduz a informação editorial para português e permite construir a tua biblioteca.</p></section><section class="searchbox"><div class="searchrow"><input id="q" value="'+esc(state.query)+'" placeholder="Título, tema ou ISBN"><input id="author" value="'+esc(state.author)+'" placeholder="Autor"><button class="primary" onclick="search()">Pesquisar</button></div><div class="filters"><input id="year" value="'+esc(state.year)+'" inputmode="numeric" placeholder="Ano"><select id="lang"><option>Todos</option><option '+(state.lang==='Português'?'selected':'')+'>Português</option><option '+(state.lang==='Inglês'?'selected':'')+'>Inglês</option><option '+(state.lang==='Espanhol'?'selected':'')+'>Espanhol</option><option '+(state.lang==='Francês'?'selected':'')+'>Francês</option></select><select id="sort"><option value="relevancia">Mais completos</option><option value="avaliacao" '+(state.sort==='avaliacao'?'selected':'')+'>Melhor avaliação</option><option value="ano-desc" '+(state.sort==='ano-desc'?'selected':'')+'>Mais recentes</option><option value="ano-asc" '+(state.sort==='ano-asc'?'selected':'')+'>Mais antigos</option></select><button class="secondary" onclick="document.getElementById(\'q\').value=\'\';document.getElementById(\'author\').value=\'\';document.getElementById(\'year\').value=\'\';state.books=[];state.status=\'Pronto.\';render()">Limpar</button></div></section><div class="status"><span>'+esc(state.status)+'</span><span>'+state.library.length+' na biblioteca</span></div>'+(state.books.length?'<section class="grid">'+state.books.map(card).join('')+'</section>':'<div class="empty">Pesquisa um livro, um autor, um tema ou introduz um ISBN.</div>')+'</main>'}function exportLibrary(){var blob=new Blob([JSON.stringify(state.library,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='librarium-biblioteca.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}function importLibrary(){var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(Array.isArray(x)){state.library=x;persist();render()}}catch(e){alert('Ficheiro de biblioteca inválido.')}};r.readAsText(f)};inp.click()}function library(){var f=document.getElementById('libFilter')?document.getElementById('libFilter').value:'Todos',items=state.library;if(f!=='Todos')items=items.filter(function(x){return x.status===f});return'<main class="wrap"><div class="library-head"><div><span class="eyebrow">A MINHA COLECÇÃO</span><h1>Biblioteca</h1><p class="note">'+state.library.length+' livros guardados neste aparelho.</p></div><div class="library-toolbar"><select id="libFilter" onchange="render()"><option>Todos</option>'+['Quero ler','A ler','Li','Quero comprar','Tenho','Favorito'].map(function(x){return'<option '+(f===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select><button class="secondary" onclick="exportLibrary()">Exportar</button><button class="secondary" onclick="importLibrary()">Importar</button></div></div>'+(items.length?'<section class="shelves">'+items.map(function(x){return'<article class="saved-card">'+(x.cover?'<img src="'+esc(x.cover)+'">':'<div class="noc">'+esc((x.title||'L')[0])+'</div>')+'<div><h3>'+esc(x.title)+'</h3><p>'+esc((x.authors||[]).join(', '))+(x.year?' · '+esc(x.year):'')+'</p><select onchange="setStatus('+JSON.stringify(x.key)+',this.value)">'+['Quero ler','A ler','Li','Quero comprar','Tenho','Favorito'].map(function(s){return'<option '+(x.status===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select><button class="textbtn" onclick="removeBook('+JSON.stringify(x.key)+')">Retirar</button></div></article>'}).join('')+'</section>':'<div class="empty">Ainda não há livros nesta secção.</div>')+'</main>'}function render(){document.getElementById('app').innerHTML='<header class="top"><div class="bar"><div class="brand">Librarium</div><button class="nav '+(state.tab==='discover'?'active':'')+'" onclick="state.tab=\'discover\';render()">Descobrir</button><button class="nav '+(state.tab==='library'?'active':'')+'" onclick="state.tab=\'library\';render()">Biblioteca <span class="badge">'+state.library.length+'</span></button></div></header>'+(state.tab==='discover'?discover():library())+modal();var q=document.getElementById('q');if(q)q.onkeydown=function(e){if(e.key==='Enter')search()};var ov=document.getElementById('overlay');if(ov)ov.onclick=function(e){if(e.target===ov){state.selected=null;render()}}}window.state=state;window.render=render;window.search=search;window.openBook=openBook;window.saveBook=saveBook;window.removeBook=removeBook;window.setStatus=setStatus;window.exportLibrary=exportLibrary;window.importLibrary=importLibrary;render()})();</script></body></html>
