<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f0e"><title>Librarium</title><style>:root{--bg:#0d0f0e;--panel:#151816;--ink:#f4efe3;--mut:#9da198;--gold:#d6b46b;--line:#2c302d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}header{position:sticky;top:0;z-index:5;padding:15px 18px;background:#0d0f0eee;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.brand{font:22px Georgia,serif}.wrap{max-width:1050px;margin:auto;padding:44px 16px}.hero h1{font:clamp(42px,8vw,78px)/.96 Georgia,serif;margin:10px 0}.hero p,.mut{color:var(--mut)}.search{display:grid;grid-template-columns:1fr auto;gap:8px;background:#141714;border:1px solid var(--line);padding:10px;border-radius:12px;margin:25px 0}.search input{background:#0e110f;color:#fff;border:1px solid #303530;border-radius:8px;padding:13px}.go{background:#e8dcc0;color:#111;border:0;border-radius:8px;padding:0 18px;font-weight:800}.status{padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 15px}.book{cursor:pointer}.cover{aspect-ratio:2/3;background:#1a1d1b;border-radius:8px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.noc{height:100%;display:grid;place-items:center;font:52px Georgia,serif;color:#746d5c}.book h2{font:18px/1.16 Georgia,serif;margin:9px 0 4px}.book p{font-size:12px;color:var(--mut);margin:0}.meta{font-size:11px;color:var(--mut);margin-top:7px}.source{font-size:10px;color:var(--gold);margin-top:4px}.overlay{position:fixed;inset:0;background:#000d;z-index:20;overflow:auto;padding:20px}.modal{max-width:850px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}.close{position:absolute;right:12px;top:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid #39403a;background:#171b18;color:#fff;font-size:24px}.mh{display:grid;grid-template-columns:180px 1fr;gap:24px;padding:46px;background:#171a16}.mh img{width:180px;height:270px;object-fit:cover;border-radius:8px}.mh h1{font:42px/1 Georgia,serif;margin:8px 0}.facts{display:flex;flex-wrap:wrap;gap:7px}.facts span{font-size:11px;border:1px solid #343a35;border-radius:99px;padding:7px 9px}.body{padding:34px 45px}.body h3{font:23px Georgia,serif;border-bottom:1px solid var(--line);padding-bottom:9px}.desc{font:16px/1.68 Georgia,serif;color:#c1c5be;white-space:pre-line}.links a{display:block;color:#e8dcc0;text-decoration:none;padding:7px 0}.loading{color:var(--gold)}.note{font-size:12px;color:var(--mut);margin-top:12px}.lib{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}.saved{padding:10px 0;border-bottom:1px solid var(--line)}.saved button{float:right;background:none;border:0;color:#aaa}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.mh{grid-template-columns:105px 1fr;padding:55px 16px 24px;gap:14px}.mh img{width:105px;height:158px}.mh h1{font-size:28px}.body{padding:22px 17px}.overlay{padding:0}.modal{min-height:100vh;border-radius:0}}</style></head><body><header><span class="brand">Librarium</span><button id="libBtn" class="go" style="padding:8px 11px">Biblioteca</button></header><main class="wrap"><section class="hero"><small style="color:#d6b46b">CATÁLOGO VIVO</small><h1>Descobre livros em português.</h1><p>O Librarium cruza Google Books e Open Library, procura várias edições e apresenta as descrições em português sempre que possível.</p></section><form id="form" class="search"><input id="q" placeholder="Título, autor ou tema"><button class="go">Pesquisar</button></form><div id="status" class="status">Pronto.</div><section id="results" class="grid"></section><section id="library" class="lib" hidden><h2>Biblioteca</h2><div id="saved"></div></section></main><div id="modal"></div><script>(function(){var books=[],saved=[];try{saved=JSON.parse(localStorage.getItem('librarium_v7')||'[]')}catch(e){}var aliases={conspiracao:['conspiracy','conspiracy theories'],conspiracoes:['conspiracy','conspiracy theories'],historia:['history'],filosofia:['philosophy'],arqueologia:['archaeology'],mitologia:['mythology'],astronomia:['astronomy'],ciencia:['science'],musica:['music'],civilizacao:['civilization'],civilizacoes:['civilizations'],religiao:['religion'],politica:['politics']};function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}function clean(s){return String(s||'').replace(/<br\s*\/?\s*>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}function isbn(v){var a=v.industryIdentifiers||[],x=a.find(function(i){return i.type==='ISBN_13'})||a[0];return x?x.identifier:''}function cover(v){var x=v.imageLinks||{};return String(x.extraLarge||x.large||x.medium||x.small||x.thumbnail||x.smallThumbnail||'').replace('http:','https:')}function gb(x){var v=x.volumeInfo||{};return{id:'g_'+x.id,title:v.title||'',authors:v.authors||[],year:(v.publishedDate||'').slice(0,4),date:v.publishedDate||'',publisher:v.publisher||'',pages:v.pageCount||'',language:v.language||'',isbn:isbn(v),description:clean(v.description),rating:v.averageRating||'',cover:cover(v),subjects:v.categories||[],source:'Google Books',workKey:''}}function ob(d){return{id:'o_'+(d.key||Math.random()),title:d.title||'',authors:d.author_name||[],year:d.first_publish_year?String(d.first_publish_year):'',date:d.first_publish_year?String(d.first_publish_year):'',publisher:(d.publisher&&d.publisher[0])||'',pages:d.number_of_pages_median||'',language:(d.language&&d.language[0])||'',isbn:(d.isbn&&d.isbn[0])||'',description:clean((d.first_sentence&&d.first_sentence[0])||''),rating:'',cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg?default=false':'',subjects:(d.subject||[]).slice(0,10),source:'Open Library',workKey:d.key||''}}function key(b){return norm(b.title+'|'+(b.authors[0]||''))}function score(b){return(b.cover?5:0)+(b.authors.length?3:0)+(b.description.length>100?4:b.description?2:0)+(b.isbn?2:0)+(b.publisher?1:0)+(b.pages?1:0)+(b.year?1:0)}function merge(a,b){var A=score(a)>=score(b)?a:b,B=A===a?b:a;return{id:A.id,title:A.title||B.title,authors:A.authors.length?A.authors:B.authors,year:A.year||B.year,date:A.date||B.date,publisher:A.publisher||B.publisher,pages:A.pages||B.pages,language:A.language||B.language,isbn:A.isbn||B.isbn,description:A.description.length>=B.description.length?A.description:B.description,rating:A.rating||B.rating,cover:A.cover||B.cover,subjects:A.subjects.length?A.subjects:B.subjects,source:A.source===B.source?A.source:'Google + Open Library',workKey:A.workKey||B.workKey}}async function getGoogle(q,pt){var u='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=40&printType=books'+(pt?'&langRestrict=pt':'');var r=await fetch(u);if(!r.ok)throw Error('google');var j=await r.json();return(j.items||[]).map(gb)}async function getOL(q){var r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=50');if(!r.ok)throw Error('ol');var j=await r.json();return(j.docs||[]).map(ob)}async function translate(text){text=clean(text);if(!text)return'';if(/\b(que|para|com|uma|não|mais|como|sobre|dos|das|livro|história)\b/i.test(text))return text;try{var parts=[],max=3000;for(var i=0;i<text.length;i+=max)parts.push(text.slice(i,i+max));var out=[];for(var p=0;p<parts.length;p++){var u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt&dt=t&q='+encodeURIComponent(parts[p]);var r=await fetch(u);if(!r.ok)throw Error('translate');var j=await r.json(),t='';(j[0]||[]).forEach(function(x){if(x&&x[0])t+=x[0]});out.push(t)}return clean(out.join(' '))||text}catch(e){return text}}function langName(x){x=(x||'').toLowerCase();return({pt:'Português',por:'Português',en:'Inglês',eng:'Inglês',es:'Espanhol',spa:'Espanhol',fr:'Francês',fre:'Francês',de:'Alemão',ger:'Alemão',it:'Italiano',ita:'Italiano'})[x]||x.toUpperCase()||'Não indicada'}async function search(){var raw=$('q').value.trim();if(!raw){$('status').textContent='Escreve uma pesquisa.';return}var n=norm(raw),terms=[raw];if(aliases[n])terms=terms.concat(aliases[n]);$('status').textContent='A procurar livros…';$('results').innerHTML='';var jobs=[];terms.forEach(function(t){jobs.push(getGoogle(t,true));jobs.push(getGoogle(t,false));jobs.push(getOL(t))});var rs=await Promise.allSettled(jobs),all=[];rs.forEach(function(r){if(r.status==='fulfilled')all=all.concat(r.value)});var m=new Map();all.forEach(function(b){if(!b.title||!b.authors.length)return;var k=key(b);m.set(k,m.has(k)?merge(m.get(k),b):b)});books=Array.from(m.values()).sort(function(a,b){return score(b)-score(a)}).slice(0,60);$('status').textContent=books.length?books.length+' resultados.':'Não encontrei resultados.';renderBooks()}function renderBooks(){$('results').innerHTML=books.map(function(b,i){return'<article class="book" data-i="'+i+'"><div class="cover">'+(b.cover?'<img loading="lazy" src="'+esc(b.cover)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="noc" style="display:none">'+esc((b.title||'L')[0])+'</div>':'<div class="noc">'+esc((b.title||'L')[0])+'</div>')+'</div><h2>'+esc(b.title)+'</h2><p>'+esc(b.authors.join(', '))+'</p><div class="meta">'+esc(b.year||'—')+(b.publisher?' · '+esc(b.publisher):'')+'</div><div class="source">'+esc(b.source)+'</div></article>'}).join('');document.querySelectorAll('.book').forEach(function(el){el.onclick=function(){openBook(+el.dataset.i)}})}async function bestDescriptions(b){var candidates=[b.description||''];var qs=[];if(b.isbn)qs.push('isbn:'+b.isbn);qs.push('intitle:'+b.title+(b.authors[0]?' inauthor:'+b.authors[0]:''));for(var q=0;q<qs.length;q++){for(var pt=0;pt<2;pt++){try{var arr=await getGoogle(qs[q],pt===0);arr.forEach(function(x){if(x.description)candidates.push(x.description);if(!b.cover&&x.cover)b.cover=x.cover;if(!b.publisher&&x.publisher)b.publisher=x.publisher;if(!b.pages&&x.pages)b.pages=x.pages;if(!b.isbn&&x.isbn)b.isbn=x.isbn})}catch(e){}}}try{var u='https://openlibrary.org/search.json?title='+encodeURIComponent(b.title)+(b.authors[0]?'&author='+encodeURIComponent(b.authors[0]):'')+'&limit=10';var r=await fetch(u);if(r.ok){var j=await r.json(),docs=j.docs||[];for(var i=0;i<docs.length;i++){var d=docs[i];if(!b.cover&&d.cover_i)b.cover='https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg?default=false';if(!b.workKey&&d.key)b.workKey=d.key;if(!b.subjects.length&&d.subject)b.subjects=d.subject.slice(0,10)}}if(b.workKey&&b.workKey.indexOf('/works/')===0){var wr=await fetch('https://openlibrary.org'+b.workKey+'.json');if(wr.ok){var w=await wr.json(),ds=w.description;if(typeof ds==='object')ds=ds.value;if(ds)candidates.push(clean(ds));if(w.subjects&&w.subjects.length>b.subjects.length)b.subjects=w.subjects.slice(0,10)}}}catch(e){}candidates=candidates.filter(Boolean).sort(function(a,b){return b.length-a.length});return candidates[0]||''}async function openBook(i){var b=books[i];showModal(b,true);var d=await bestDescriptions(b);b.descriptionOriginal=d;b.description=await translate(d);if(b.subjects.length){var st=await translate(b.subjects.slice(0,8).join(' · '));b.subjectsPT=st}showModal(b,false)}function showModal(b,loading){var q=encodeURIComponent(b.title+' '+(b.authors[0]||''));var desc=b.description||'';$('modal').innerHTML='<div class="overlay" id="ov"><section class="modal"><button id="close" class="close">×</button><div class="mh">'+(b.cover?'<img src="'+esc(b.cover)+'">':'<div class="noc" style="width:180px;height:270px">'+esc((b.title||'L')[0])+'</div>')+'<div><small>'+esc(b.source)+'</small><h1>'+esc(b.title)+'</h1><p class="mut">'+esc(b.authors.join(', '))+'</p><div class="facts"><span>'+esc(b.year||'—')+'</span><span>'+esc(b.pages||'—')+' págs.</span><span>'+esc(langName(b.language))+'</span><span>'+(b.rating?'★ '+esc(b.rating):'Sem nota')+'</span></div><br><button id="saveBtn" class="go" style="padding:10px 14px">Guardar</button></div></div><div class="body"><h3>Resumo / descrição</h3>'+(loading?'<p class="loading">A procurar a melhor descrição e a preparar a versão portuguesa…</p>':'')+'<div class="desc">'+esc(desc||'Não foi possível obter uma descrição suficientemente completa para este livro.')+'</div>'+(!loading&&b.descriptionOriginal&&b.description!==b.descriptionOriginal?'<p class="note">Tradução automática para português a partir da descrição editorial disponível.</p>':'')+'<h3>Dados da edição</h3><p>'+esc(b.publisher||'Editora não indicada')+'<br>'+esc(b.date||b.year||'Data não indicada')+'<br>ISBN '+esc(b.isbn||'—')+'</p><h3>Assuntos</h3><p class="mut">'+esc(b.subjectsPT||(b.subjects||[]).join(' · ')||'Sem classificação temática disponível.')+'</p><div class="links"><a target="_blank" href="https://www.google.com/search?q='+q+' livro">Pesquisar na web ↗</a><a target="_blank" href="https://www.wook.pt/pesquisa/'+q+'">Wook ↗</a><a target="_blank" href="https://www.bertrand.pt/pesquisa/'+q+'">Bertrand ↗</a></div></div></section></div>';$('close').onclick=function(){$('modal').innerHTML=''};$('ov').onclick=function(e){if(e.target.id==='ov')$('modal').innerHTML=''};$('saveBtn').onclick=function(){saveBook(b)}}function saveBook(b){if(!saved.some(function(x){return x.title===b.title&&x.author===b.authors.join(', ')}))saved.unshift({title:b.title,author:b.authors.join(', '),cover:b.cover});localStorage.setItem('librarium_v7',JSON.stringify(saved));renderSaved()}function renderSaved(){$('saved').innerHTML=saved.length?saved.map(function(x,i){return'<div class="saved"><b>'+esc(x.title)+'</b><button data-r="'+i+'">Retirar</button><div class="mut">'+esc(x.author)+'</div></div>'}).join(''):'<p class="mut">Ainda não guardaste livros.</p>';document.querySelectorAll('[data-r]').forEach(function(el){el.onclick=function(){saved.splice(+el.dataset.r,1);localStorage.setItem('librarium_v7',JSON.stringify(saved));renderSaved()}})}$('form').onsubmit=function(e){e.preventDefault();search()};$('libBtn').onclick=function(){var l=$('library');l.hidden=!l.hidden;if(!l.hidden){renderSaved();l.scrollIntoView({behavior:'smooth'})}};renderSaved()})();</script></body></html>
