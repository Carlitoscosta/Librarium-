<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f0e"><meta name="apple-mobile-web-app-capable" content="yes"><title>Librarium</title><style>:root{--bg:#0d0f0e;--p:#151816;--ink:#f4efe3;--mut:#9da198;--gold:#d6b46b;--line:#2c302d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#0d0f0eee;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}.brand{font:22px Georgia,serif;color:var(--ink);background:0;border:0}.top button{border:0;background:#1b1f1c;color:var(--ink);border-radius:9px;padding:9px 12px}.hero{padding:62px 20px 28px;max-width:1050px;margin:auto}.hero small{color:var(--gold);letter-spacing:.18em}.hero h1{font:clamp(44px,8vw,88px)/.95 Georgia,serif;margin:16px 0}.hero p{color:var(--mut);font-size:17px;max-width:720px;line-height:1.6}.search{max-width:1050px;margin:0 auto 34px;padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px;background:#121513;border:1px solid var(--line);border-radius:13px}.search input,.search select{background:#0e110f;border:1px solid #303530;border-radius:8px;color:var(--ink);padding:12px;min-width:0}.go{background:#e8dcc0!important;color:#161713!important;font-weight:800;border:0!important}.head{max-width:1050px;margin:0 auto 18px;padding:0 4px 12px;border-bottom:1px solid var(--line);font:21px Georgia,serif}.grid{max-width:1050px;margin:auto;padding-bottom:70px;display:grid;grid-template-columns:repeat(4,1fr);gap:25px 16px}.book{cursor:pointer}.cover{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#1a1d1b;box-shadow:0 15px 35px #0005;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.noc{height:100%;display:grid;place-items:center;font:60px Georgia,serif;color:#756d58}.book h2{font:18px/1.15 Georgia,serif;margin:10px 0 5px}.book p{font-size:12px;color:var(--mut);margin:0}.meta{display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}.save{position:absolute;right:8px;top:8px;border:1px solid #ffffff30;background:#111d;color:#fff;border-radius:50%;width:34px;height:34px}.saved{background:#e8dcc0;color:#111}.overlay{position:fixed;inset:0;z-index:20;background:#000c;overflow:auto;padding:20px}.modal{max-width:900px;margin:10px auto;background:#121513;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}.x{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;background:#171b18;color:#fff;border:1px solid #39403a;font-size:24px}.mh{display:grid;grid-template-columns:180px 1fr;gap:26px;padding:45px;background:#171a16}.mh img,.mh .noc{width:180px;height:270px;border-radius:7px;object-fit:cover}.mh h1{font:43px/1 Georgia,serif;margin:8px 0}.mh p{color:var(--mut)}.facts{display:flex;flex-wrap:wrap;gap:7px}.facts span{font-size:11px;border:1px solid #343a35;border-radius:99px;padding:7px 9px}.body{display:grid;grid-template-columns:1.6fr .8fr;gap:35px;padding:36px 45px}.body h3{font:23px Georgia,serif;border-bottom:1px solid var(--line);padding-bottom:9px}.desc{font:16px/1.65 Georgia,serif;color:#bcc0b8}.stores a{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);color:#d0d3cd;text-decoration:none;font-size:12px}.stores b{color:var(--gold)}.lib{max-width:1050px;margin:auto;padding:45px 20px 80px}.lib h1{font:56px Georgia,serif}.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{display:grid;grid-template-columns:70px 1fr;gap:12px;border:1px solid var(--line);background:#121513;padding:10px;border-radius:10px}.item img{width:70px;height:105px;object-fit:cover}.item h3{font:18px Georgia,serif;margin:4px 0}.item p{font-size:12px;color:var(--mut)}.item select{width:100%;background:#0e110f;color:#fff;border:1px solid #303530;padding:7px;border-radius:6px}.empty{color:var(--mut)}@media(max-width:760px){.search{margin:0 12px 30px;grid-template-columns:1fr 1fr}.search input:first-child{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr);padding:0 14px 60px;gap:23px 12px}.head{margin:0 14px 15px}.hero{padding-top:46px}.mh{grid-template-columns:100px 1fr;padding:58px 16px 24px;gap:15px}.mh img,.mh .noc{width:100px;height:150px}.mh h1{font-size:29px}.body{grid-template-columns:1fr;padding:24px 17px}.overlay{padding:0}.modal{margin:0;min-height:100vh;border-radius:0}.shelf{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const genres=['Todos','Ficção','Romance','Policial','Thriller','Mistério','Fantasia','Ficção científica','História','Filosofia','Biografia','Poesia','Ensaio','Terror','Infantil'];let s={tab:'d',books:[],q:'',author:'',genre:'Todos',sel:null,lib:[],note:''};try{s.lib=JSON.parse(localStorage.getItem('librarium')||'[]')}catch{}const e=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])),cover=b=>b.volumeInfo?.imageLinks?.thumbnail?.replace('http:','https:')||'',year=b=>b.volumeInfo?.publishedDate?.slice(0,4)||'—',isbn=b=>(b.volumeInfo?.industryIdentifiers||[]).find(x=>x.type==='ISBN_13')?.identifier||(b.volumeInfo?.industryIdentifiers||[])[0]?.identifier||'',norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const EN={conspiracao:['conspiracy','conspiracy theories'],conspiracoes:['conspiracy','conspiracy theories'],civilizacao:['civilization'],civilizacoes:['civilizations'],historia:['history'],filosofia:['philosophy'],arqueologia:['archaeology'],mitologia:['mythology'],religiao:['religion'],musica:['music'],ciencia:['science'],astronomia:['astronomy'],politica:['politics']};function persist(){localStorage.setItem('librarium',JSON.stringify(s.lib))}function save(b){if(!b)return;let v=b.volumeInfo||{},i={id:b.id,title:v.title,authors:v.authors||[],cover:cover(b),status:'Quero ler'};let n=s.lib.findIndex(x=>x.id===b.id);n>=0?s.lib[n]=i:s.lib.unshift(i);persist();render()}function remove(id){s.lib=s.lib.filter(x=>x.id!==id);persist();render()}function olBook(d){return{id:'ol_'+(d.key||Math.random()),volumeInfo:{title:d.title||'Sem título',authors:d.author_name||[],publishedDate:d.first_publish_year?String(d.first_publish_year):'',publisher:d.publisher?.[0]||'',pageCount:d.number_of_pages_median||0,language:d.language?.[0]||'',categories:(d.subject||[]).slice(0,4),imageLinks:d.cover_i?{thumbnail:'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg'}:undefined,industryIdentifiers:d.isbn?.[0]?[{type:'ISBN',identifier:d.isbn[0]}]:[],infoLink:d.key?'https://openlibrary.org'+d.key:'https://openlibrary.org'}}}function keyBook(b){let v=b.volumeInfo||{};return norm((v.title||'')+'|'+(v.authors?.[0]||''))}async function google(q){let r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=40&country=PT&printType=books');if(!r.ok)throw Error('google');let j=await r.json();return j.items||[]}async function openlib(q){let u='https://openlibrary.org/search.json?limit=40&q='+encodeURIComponent(q);let r=await fetch(u);if(!r.ok)throw Error('openlibrary');let j=await r.json();return(j.docs||[]).map(olBook)}async function search(){let raw=s.q.trim(),base=[];if(raw)base.push(raw);let n=norm(raw);if(n&&n!==raw.toLowerCase())base.push(n);if(EN[n])base.push(...EN[n]);if(!raw)base.push('best sellers');let author=s.author.trim();let genre=s.genre!=='Todos'?s.genre:'';let gq=base.map(x=>[x,author?'inauthor:'+author:'',genre?'subject:'+genre:''].filter(Boolean).join(' '));let oq=base.map(x=>[x,author,genre].filter(Boolean).join(' '));s.note='A procurar em Google Books e Open Library…';render();let jobs=[...gq.map(google),...oq.map(openlib)];let settled=await Promise.allSettled(jobs),all=[];for(let r of settled)if(r.status==='fulfilled')all.push(...r.value);let seen=new Set();s.books=all.filter(b=>{let k=keyBook(b);if(!k||seen.has(k))return false;seen.add(k);return true}).slice(0,60);s.note=s.books.length?`${s.books.length} resultados · Google Books + Open Library`:'Nenhum resultado. Experimenta outra palavra ou o título/autor.';render()}function openBook(id){s.sel=s.books.find(x=>x.id===id)||null;render()}function stores(b){let v=b.volumeInfo||{},q=encodeURIComponent((v.title||'')+' '+(isbn(b)||v.authors?.[0]||''));return [['Google Books','Ficha',v.infoLink||'https://books.google.com'],['Open Library','Procurar','https://openlibrary.org/search?q='+q],['Wook','Consultar','https://www.wook.pt/pesquisa/'+q],['Bertrand','Consultar','https://www.bertrand.pt/pesquisa/'+q],['FNAC','Consultar','https://www.fnac.pt/SearchResult/ResultList.aspx?Search='+q],['Amazon ES','Consultar','https://www.amazon.es/s?k='+q]]}function modal(){let b=s.sel;if(!b)return'';let v=b.volumeInfo||{},sv=s.lib.some(x=>x.id===b.id);return `<div class="overlay" onclick="if(event.target===this){s.sel=null;render()}"><section class="modal"><button class="x" onclick="s.sel=null;render()">×</button><div class="mh">${cover(b)?`<img src="${e(cover(b))}">`:`<div class="noc">${e(v.title?.[0]||'L')}</div>`}<div><small>${e(v.categories?.join(' · ')||'LIVRO')}</small><h1>${e(v.title)}</h1><p>${e(v.authors?.join(', ')||'Autor desconhecido')}</p><div class="facts"><span>${year(b)}</span><span>${v.pageCount||'—'} págs.</span><span>${e((v.language||'—').toUpperCase())}</span><span>${v.averageRating?'★ '+v.averageRating:'Sem nota'}</span></div><br><button class="go" style="padding:10px 15px;border-radius:8px" onclick="save(s.sel)">${sv?'Actualizar biblioteca':'Guardar na biblioteca'}</button></div></div><div class="body"><main><h3>Sinopse</h3><div class="desc">${v.description||'Sem sinopse disponível para esta edição.'}</div><h3>Crítica e recepção</h3><p class="desc">${v.averageRating?'Google Books: '+v.averageRating+' / 5'+(v.ratingsCount?' em '+v.ratingsCount+' avaliações.':'.'):'Sem avaliação agregada disponível nesta fonte.'}</p><a style="color:#e8dcc0" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent('"'+(v.title||'')+'" '+(v.authors?.[0]||'')+' crítica review')}">Pesquisar crítica profissional ↗</a></main><aside><h3>Edição</h3><p>${e(v.publisher||'Editora desconhecida')}<br>${e(v.publishedDate||'Data desconhecida')}<br>ISBN ${e(isbn(b)||'—')}</p><h3>Preços e lojas</h3><div class="stores">${stores(b).map(x=>`<a target="_blank" href="${e(x[2])}"><span>${x[0]}</span><b>${x[1]}</b></a>`).join('')}</div></aside></div></section></div>`}function cards(){return s.books.map(b=>{let v=b.volumeInfo||{},saved=s.lib.some(x=>x.id===b.id),price=b.saleInfo?.retailPrice;return `<article class="book" onclick="openBook('${b.id}')"><div class="cover">${cover(b)?`<img loading="lazy" src="${e(cover(b))}">`:`<div class="noc">${e(v.title?.[0]||'L')}</div>`}<button class="save ${saved?'saved':''}" onclick="event.stopPropagation();save(s.books.find(x=>x.id==='${b.id}'))">${saved?'✓':'＋'}</button></div><h2>${e(v.title)}</h2><p>${e(v.authors?.join(', ')||'Autor desconhecido')}</p><div class="meta"><span>${year(b)}</span><span>${price?new Intl.NumberFormat('pt-PT',{style:'currency',currency:price.currencyCode}).format(price.amount):v.averageRating?'★ '+v.averageRating:b.id.startsWith('ol_')?'Open Library':'Sem preço'}</span></div></article>`}).join('')}function library(){return `<section class="lib"><h1>Biblioteca</h1><p>${s.lib.length} livros guardados neste aparelho.</p>${s.lib.length?`<div class="shelf">${s.lib.map(i=>`<div class="item">${i.cover?`<img src="${e(i.cover)}">`:'<div></div>'}<div><h3>${e(i.title)}</h3><p>${e(i.authors.join(', '))}</p><select onchange="s.lib=s.lib.map(x=>x.id==='${i.id}'?{...x,status:this.value}:x);persist()">${['Quero ler','A ler','Li','Quero comprar','Tenho','Favorito'].map(x=>`<option ${i.status===x?'selected':''}>${x}</option>`).join('')}</select><button style="background:0;border:0;color:#888;padding:8px 0" onclick="remove('${i.id}')">Retirar</button></div></div>`).join('')}</div>`:'<p class="empty">Ainda não guardaste livros.</p>'}</section>`}function render(){document.querySelector('#app').innerHTML=`<header class="top"><button class="brand" onclick="s.tab='d';render()">Librarium</button><button onclick="s.tab=s.tab==='d'?'l':'d';render()">${s.tab==='d'?'Biblioteca ('+s.lib.length+')':'Descobrir'}</button></header>${s.tab==='d'?`<section class="hero"><small>CATÁLOGO VIVO</small><h1>Encontra o próximo livro.</h1><p>Pesquisa por título, autor, tema ou género. A pesquisa cruza catálogos e tenta também variantes linguísticas do termo.</p></section><form class="search" onsubmit="event.preventDefault();s.q=q.value;s.author=author.value;s.genre=genre.value;search()"><input id="q" value="${e(s.q)}" placeholder="Título, tema ou palavras"><input id="author" value="${e(s.author)}" placeholder="Autor"><select id="genre">${genres.map(g=>`<option ${s.genre===g?'selected':''}>${g}</option>`).join('')}</select><button class="go">Pesquisar</button></form><div class="head" id="count">${e(s.note||s.books.length+' livros')}</div><section class="grid">${cards()}</section>`:library()}${modal()}`}render();search();</script></body></html>
