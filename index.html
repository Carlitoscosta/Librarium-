<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f0e"><title>Librarium</title><style>body{margin:0;background:#0d0f0e;color:#f4efe3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}button,input{font:inherit}header{position:sticky;top:0;z-index:5;padding:15px 18px;background:#0d0f0eee;border-bottom:1px solid #2c302d;display:flex;justify-content:space-between}.brand{font:22px Georgia,serif}.wrap{max-width:1050px;margin:auto;padding:44px 16px}.hero h1{font:clamp(42px,8vw,78px)/.96 Georgia,serif;margin:10px 0}.hero p,.mut{color:#9da198}.search{display:grid;grid-template-columns:1fr auto;gap:8px;background:#141714;border:1px solid #2c302d;padding:10px;border-radius:12px;margin:25px 0}.search input{background:#0e110f;color:#fff;border:1px solid #303530;border-radius:8px;padding:13px}.go{background:#e8dcc0;color:#111;border:0;border-radius:8px;padding:0 18px;font-weight:800}.status{padding-bottom:13px;border-bottom:1px solid #2c302d;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 15px}.book{cursor:pointer}.cover{aspect-ratio:2/3;background:#1a1d1b;border-radius:8px;overflow:hidden;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.noc{height:100%;display:grid;place-items:center;font:52px Georgia,serif;color:#746d5c}.book h2{font:18px/1.16 Georgia,serif;margin:9px 0 4px}.book p{font-size:12px;color:#9da198;margin:0}.meta{font-size:11px;color:#9da198;margin-top:7px}.source{font-size:10px;color:#d6b46b;margin-top:4px}.overlay{position:fixed;inset:0;background:#000d;z-index:20;overflow:auto;padding:20px}.modal{max-width:850px;margin:auto;background:#151816;border:1px solid #2c302d;border-radius:14px;position:relative;overflow:hidden}.close{position:absolute;right:12px;top:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid #39403a;background:#171b18;color:#fff;font-size:24px}.mh{display:grid;grid-template-columns:180px 1fr;gap:24px;padding:46px;background:#171a16}.mh img{width:180px;height:270px;object-fit:cover;border-radius:8px}.mh h1{font:42px/1 Georgia,serif;margin:8px 0}.facts{display:flex;flex-wrap:wrap;gap:7px}.facts span{font-size:11px;border:1px solid #343a35;border-radius:99px;padding:7px 9px}.body{padding:34px 45px}.body h3{font:23px Georgia,serif;border-bottom:1px solid #2c302d;padding-bottom:9px}.desc{font:16px/1.65 Georgia,serif;color:#c1c5be;white-space:pre-line}.links a{display:block;color:#e8dcc0;text-decoration:none;padding:7px 0}.loading{color:#d6b46b}.lib{margin-top:28px;padding-top:22px;border-top:1px solid #2c302d}.saved{padding:10px 0;border-bottom:1px solid #2c302d}.saved button{float:right;background:none;border:0;color:#aaa}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.mh{grid-template-columns:105px 1fr;padding:55px 16px 24px;gap:14px}.mh img{width:105px;height:158px}.mh h1{font-size:28px}.body{padding:22px 17px}.overlay{padding:0}.modal{min-height:100vh;border-radius:0}}</style></head><body><header><span class="brand">Librarium</span><button id="libBtn" class="go" style="padding:8px 11px">Biblioteca</button></header><main class="wrap"><section class="hero"><small style="color:#d6b46b">CATÁLOGO VIVO</small><h1>Encontra livros com capas e fichas melhores.</h1><p>O Librarium cruza várias edições do Google Books e da Open Library para recuperar capas, ISBN, editora e descrições mais completas.</p></section><form id="form" class="search"><input id="q" placeholder="Título, autor ou tema"><button class="go">Pesquisar</button></form><div id="status" class="status">Pronto.</div><section id="results" class="grid"></section><section id="library" class="lib" hidden><h2>Biblioteca</h2><div id="saved"></div></section></main><div id="modal"></div><script>(function(){var books=[],saved=[];try{saved=JSON.parse(localStorage.getItem('librarium_v5')||'[]')}catch(e){}var aliases={conspiracao:['conspiracy','conspiracy theories'],conspiracoes:['conspiracy','conspiracy theories'],historia:['history'],filosofia:['philosophy'],arqueologia:['archaeology'],mitologia:['mythology'],astronomia:['astronomy'],ciencia:['science'],musica:['music'],civilizacao:['civilization'],civilizacoes:['civilizations'],religiao:['religion'],politica:['politics']};function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}function isbn(v){var a=v.industryIdentifiers||[];var i=a.find(function(x){return x.type==='ISBN_13'})||a[0];return i?i.identifier:''}function gCover(v){var x=v.imageLinks||{};return String(x.extraLarge||x.large||x.medium||x.small||x.thumbnail||x.smallThumbnail||'').replace('http:','https:')}function googleBook(x){var v=x.volumeInfo||{};return{id:'g_'+x.id,title:v.title||'',authors:v.authors||[],year:(v.publishedDate||'').slice(0,4),date:v.publishedDate||'',publisher:v.publisher||'',pages:v.pageCount||'',language:v.language||'',isbn:isbn(v),description:v.description||'',rating:v.averageRating||'',cover:gCover(v),categories:v.categories||[],info:v.infoLink||'',source:'Google Books',workKey:'',coverId:''}}function olBook(d){return{id:'o_'+(d.key||Math.random()),title:d.title||'',authors:d.author_name||[],year:d.first_publish_year?String(d.first_publish_year):'',date:d.first_publish_year?String(d.first_publish_year):'',publisher:(d.publisher&&d.publisher[0])||'',pages:d.number_of_pages_median||'',language:(d.language&&d.language[0])||'',isbn:(d.isbn&&d.isbn[0])||'',description:(d.first_sentence&&d.first_sentence[0])||'',rating:'',cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg?default=false':'',categories:(d.subject||[]).slice(0,8),info:d.key?'https://openlibrary.org'+d.key:'',source:'Open Library',workKey:d.key||'',coverId:d.cover_i||''}}function key(b){return norm(b.title+'|'+(b.authors[0]||''))}function score(b){var n=0;if(b.cover)n+=5;if(b.authors.length)n+=3;if(b.description)n+=3;if(b.publisher)n++;if(b.isbn)n+=2;if(b.pages)n++;if(b.year)n++;return n}function merge(a,b){var A=score(a)>=score(b)?a:b,B=A===a?b:a;return{id:A.id,title:A.title||B.title,authors:A.authors.length?A.authors:B.authors,year:A.year||B.year,date:A.date||B.date,publisher:A.publisher||B.publisher,pages:A.pages||B.pages,language:A.language||B.language,isbn:A.isbn||B.isbn,description:(A.description||'').length>=(B.description||'').length?A.description:B.description,rating:A.rating||B.rating,cover:A.cover||B.cover,categories:A.categories.length?A.categories:B.categories,info:A.info||B.info,source:A.source===B.source?A.source:'Google + Open Library',workKey:A.workKey||B.workKey,coverId:A.coverId||B.coverId}}async function getGoogle(term){var r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(term)+'&maxResults=40&printType=books');if(!r.ok)throw Error('google');var j=await r.json();return(j.items||[]).map(googleBook)}async function getOL(term){var r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(term)+'&limit=60');if(!r.ok)throw Error('ol');var j=await r.json();return(j.docs||[]).map(olBook)}function probe(url){return new Promise(function(resolve){var im=new Image();var done=false;var t=setTimeout(function(){if(!done){done=true;resolve(false)}},4500);im.onload=function(){if(done)return;done=true;clearTimeout(t);resolve(im.naturalWidth>10&&im.naturalHeight>10)};im.onerror=function(){if(done)return;done=true;clearTimeout(t);resolve(false)};im.src=url})}async function findCover(b){if(b.cover&&await probe(b.cover))return b.cover;if(b.isbn){var byIsbn='https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(b.isbn)+'-L.jpg?default=false';if(await probe(byIsbn))return byIsbn}try{var oq='title='+encodeURIComponent(b.title)+(b.authors[0]?'&author='+encodeURIComponent(b.authors[0]):'')+'&limit=12';var r=await fetch('https://openlibrary.org/search.json?'+oq);if(r.ok){var j=await r.json();var docs=j.docs||[];for(var i=0;i<docs.length;i++){if(docs[i].cover_i){var u='https://covers.openlibrary.org/b/id/'+docs[i].cover_i+'-L.jpg?default=false';if(await probe(u)){if(!b.workKey)b.workKey=docs[i].key||'';if(!b.isbn&&docs[i].isbn)b.isbn=docs[i].isbn[0]||'';return u}}}}}catch(e){}try{var q='intitle:'+b.title+(b.authors[0]?' inauthor:'+b.authors[0]:'');var g=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=10&printType=books');if(g.ok){var gj=await g.json();var items=gj.items||[];for(var k=0;k<items.length;k++){var c=gCover(items[k].volumeInfo||{});if(c&&await probe(c)){var gb=googleBook(items[k]);var mb=merge(b,gb);Object.assign(b,mb);return c}}}}catch(e){}return''}async function fillCovers(){var targets=[];for(var i=0;i<books.length&&targets.length<36;i++)if(!books[i].cover)targets.push(i);for(var p=0;p<targets.length;p+=5){var batch=targets.slice(p,p+5).map(async function(idx){var c=await findCover(books[idx]);if(c)books[idx].cover=c});await Promise.allSettled(batch);renderBooks();await new Promise(function(r){setTimeout(r,120)})}}async function search(){var raw=$('q').value.trim();if(!raw){$('status').textContent='Escreve uma pesquisa.';return}var n=norm(raw),terms=[raw];if(aliases[n])terms=terms.concat(aliases[n]);$('status').textContent='A procurar livros e edições…';$('results').innerHTML='';var jobs=[];terms.forEach(function(t){jobs.push(getGoogle(t));jobs.push(getOL(t))});var rs=await Promise.allSettled(jobs),all=[];rs.forEach(function(r){if(r.status==='fulfilled')all=all.concat(r.value)});var m=new Map();all.forEach(function(b){if(!b.title||!b.authors.length)return;var k=key(b);m.set(k,m.has(k)?merge(m.get(k),b):b)});books=Array.from(m.values()).sort(function(a,b){return score(b)-score(a)}).slice(0,60);$('status').textContent=books.length?books.length+' resultados. A recuperar capas em falta…':'Não encontrei resultados.';renderBooks();await fillCovers();var withCover=books.filter(function(b){return !!b.cover}).length;$('status').textContent=books.length?books.length+' resultados · '+withCover+' com capa encontrada.':'Não encontrei resultados.'}function renderBooks(){$('results').innerHTML=books.map(function(b,i){return'<article class="book" data-i="'+i+'"><div class="cover">'+(b.cover?'<img loading="lazy" src="'+esc(b.cover)+'" onerror="window.recoverCover('+i+')"><div class="noc" style="display:none">'+esc((b.title||'L')[0])+'</div>':'<div class="noc">'+esc((b.title||'L')[0])+'</div>')+'</div><h2>'+esc(b.title)+'</h2><p>'+esc(b.authors.join(', '))+'</p><div class="meta">'+esc(b.year||'—')+(b.publisher?' · '+esc(b.publisher):'')+'</div><div class="source">'+esc(b.source)+'</div></article>'}).join('');Array.from(document.querySelectorAll('.book')).forEach(function(el){el.onclick=function(){openBook(Number(el.getAttribute('data-i')))}})}window.recoverCover=async function(i){if(!books[i])return;books[i].cover='';var c=await findCover(books[i]);if(c)books[i].cover=c;renderBooks()};async function enrich(b){var tasks=[];if(b.workKey&&b.workKey.indexOf('/works/')===0){tasks.push((async function(){try{var r=await fetch('https://openlibrary.org'+b.workKey+'.json');if(r.ok){var j=await r.json();var d=j.description;if(typeof d==='object')d=d.value;if(d&&String(d).length>(b.description||'').length)b.description=String(d);if(j.subjects&&j.subjects.length>b.categories.length)b.categories=j.subjects.slice(0,12)}}catch(e){}})())}tasks.push((async function(){try{var q='intitle:'+b.title+(b.authors[0]?' inauthor:'+b.authors[0]:'');var r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=10&printType=books');if(r.ok){var j=await r.json();(j.items||[]).forEach(function(x){var g=googleBook(x);if((g.description||'').length>(b.description||'').length)b.description=g.description;if(!b.publisher&&g.publisher)b.publisher=g.publisher;if(!b.pages&&g.pages)b.pages=g.pages;if(!b.isbn&&g.isbn)b.isbn=g.isbn;if(!b.cover&&g.cover)b.cover=g.cover})}}catch(e){}})());if(!b.cover)tasks.push((async function(){b.cover=await findCover(b)})());await Promise.allSettled(tasks);return b}async function openBook(i){var b=books[i];showModal(b,true);await enrich(b);showModal(b,false)}function showModal(b,loading){var q=encodeURIComponent(b.title+' '+(b.authors[0]||''));$('modal').innerHTML='<div class="overlay" id="ov"><section class="modal"><button id="close" class="close">×</button><div class="mh">'+(b.cover?'<img src="'+esc(b.cover)+'">':'<div class="noc" style="width:180px;height:270px">'+esc((b.title||'L')[0])+'</div>')+'<div><small>'+esc(b.source)+'</small><h1>'+esc(b.title)+'</h1><p class="mut">'+esc(b.authors.join(', '))+'</p><div class="facts"><span>'+esc(b.year||'—')+'</span><span>'+esc(b.pages||'—')+' págs.</span><span>'+esc((b.language||'—').toUpperCase())+'</span><span>'+(b.rating?'★ '+esc(b.rating):'Sem nota')+'</span></div><br><button id="saveBtn" class="go" style="padding:10px 14px">Guardar</button></div></div><div class="body"><h3>Descrição</h3>'+(loading?'<p class="loading">A procurar uma descrição e edição mais completas…</p>':'')+'<div class="desc">'+esc(b.description||'Não foi encontrada uma descrição extensa para esta edição.')+'</div><h3>Dados</h3><p>'+esc(b.publisher||'Editora não indicada')+'<br>'+esc(b.date||b.year||'Data não indicada')+'<br>ISBN '+esc(b.isbn||'—')+'</p><h3>Assuntos</h3><p class="mut">'+esc((b.categories||[]).join(' · ')||'Sem classificação temática disponível.')+'</p><div class="links"><a target="_blank" href="https://www.google.com/search?q='+q+' livro">Pesquisar na web ↗</a><a target="_blank" href="https://www.wook.pt/pesquisa/'+q+'">Wook ↗</a><a target="_blank" href="https://www.bertrand.pt/pesquisa/'+q+'">Bertrand ↗</a></div></div></section></div>';$('close').onclick=function(){$('modal').innerHTML=''};$('ov').onclick=function(e){if(e.target.id==='ov')$('modal').innerHTML=''};$('saveBtn').onclick=function(){saveBook(b)}}function saveBook(b){if(!saved.some(function(x){return x.title===b.title&&x.author===b.authors.join(', ')}))saved.unshift({title:b.title,author:b.authors.join(', '),cover:b.cover});localStorage.setItem('librarium_v5',JSON.stringify(saved));renderSaved()}function renderSaved(){$('saved').innerHTML=saved.length?saved.map(function(x,i){return'<div class="saved"><b>'+esc(x.title)+'</b><button data-r="'+i+'">Retirar</button><div class="mut">'+esc(x.author)+'</div></div>'}).join(''):'<p class="mut">Ainda não guardaste livros.</p>';Array.from(document.querySelectorAll('[data-r]')).forEach(function(el){el.onclick=function(){saved.splice(Number(el.getAttribute('data-r')),1);localStorage.setItem('librarium_v5',JSON.stringify(saved));renderSaved()}})}$('form').onsubmit=function(e){e.preventDefault();search()};$('libBtn').onclick=function(){var l=$('library');l.hidden=!l.hidden;if(!l.hidden){renderSaved();l.scrollIntoView({behavior:'smooth'})}};renderSaved()})();</script></body></html>
